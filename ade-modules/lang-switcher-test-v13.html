<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karuzela 3D - Poprawiona Logika</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .scene {
            width: 500px; /* Nieco szersza scena dla lepszej widoczności */
            height: 250px;
            perspective: 1200px;
        }

        .world {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            cursor: grab;
        }

        .world.is-dragging {
            cursor: grabbing;
        }
        
        .item {
            position: absolute;
            top: calc(50% - 22px); /* Połowa wysokości */
            height: 44px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px; /* Odstęp między flagą a tekstem */
            
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            
            font-size: 18px;
            font-weight: 600;
            
            cursor: pointer;
            padding: 0 12px;
            
            backface-visibility: hidden;
            user-select: none;
        }
        
        .flag-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0; 
        }

    </style>
</head>
<body>

    <div class="scene">
        <div class="world"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Szerokość kafelka, aby zmieścić flagę i tekst.
            const tileWidth = 95;

            const countries = [
                { code: 'AU', name: 'Australia' }, { code: 'BR', name: 'Brazylia' },
                { code: 'CA', name: 'Kanada' }, { code: 'CN', name: 'Chiny' },
                { code: 'DE', name: 'Niemcy' }, { code: 'ES', name: 'Hiszpania' },
                { code: 'FR', name: 'Francja' }, { code: 'GB', name: 'Wielka Brytania' },
                { code: 'IN', name: 'Indie' }, { code: 'IT', name: 'Włochy' },
                { code: 'JP', name: 'Japonia' }, { code: 'MX', name: 'Meksyk' },
                { code: 'PL', name: 'Polska' }, { code: 'ZA', name: 'RPA' },
                { code: 'US', name: 'USA' }
            ];

            const world = document.querySelector('.world');
            const totalItems = countries.length;
            
            // --- KLUCZOWA POPRAWKA LOGIKI ---
            // Obliczamy minimalny promień i dodajemy do niego "bufor" (np. 40px),
            // aby celowo stworzyć odstęp między kafelkami i zapobiec ich nachodzeniu na siebie.
            const minimumRadius = (tileWidth / 2) / Math.tan(Math.PI / totalItems);
            const radius = minimumRadius + 40; 
            
            countries.forEach((country, index) => {
                const item = document.createElement('div');
                item.className = 'item';
                
                // JS ustawia szerokość i pozycję każdego kafelka
                item.style.width = `${tileWidth}px`;
                item.style.left = `calc(50% - ${tileWidth / 2}px)`;

                // Przywrócenie flagi i tekstu
                const flagImg = document.createElement('img');
                flagImg.className = 'flag-icon';
                flagImg.src = `https://hatscripts.github.io/circle-flags/flags/${country.code.toLowerCase()}.svg`;
                flagImg.alt = ''; 
                flagImg.draggable = false;

                const codeSpan = document.createElement('span');
                codeSpan.innerText = country.code;

                item.appendChild(flagImg);
                item.appendChild(codeSpan);

                // Ustawienie każdego elementu na okręgu
                const angle = (360 / totalItems) * index;
                item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                world.appendChild(item);
            });

            // Logika przeciągania (bez zmian)
            let currentRotationY = 0;
            let isDragging = false;
            let startX = 0;
            let lastX = 0;
            let velocity = 0;
            let animationFrame = null;
            const friction = 0.95;
            const rotationSensitivity = 0.4;

            const updateRotation = () => {
                world.style.transform = `rotateY(${currentRotationY}deg)`;
            };

            const inertiaAnimate = () => {
                currentRotationY += velocity;
                velocity *= friction;
                updateRotation();
                if (Math.abs(velocity) > 0.1) {
                    animationFrame = requestAnimationFrame(inertiaAnimate);
                }
            };

            const onDragStart = (e) => {
                e.preventDefault();
                isDragging = true;
                world.classList.add('is-dragging');
                cancelAnimationFrame(animationFrame);
                startX = e.clientX || e.touches[0].clientX;
                lastX = startX;
                window.addEventListener('mousemove', onDragMove);
                window.addEventListener('mouseup', onDragEnd);
                window.addEventListener('touchmove', onDragMove, { passive: false });
                window.addEventListener('touchend', onDragEnd);
            };

            const onDragMove = (e) => {
                if (!isDragging) return;
                const currentX = e.clientX || e.touches[0].clientX;
                const deltaX = currentX - lastX;
                velocity = deltaX * rotationSensitivity;
                currentRotationY += velocity;
                lastX = currentX;
                updateRotation();
            };

            const onDragEnd = () => {
                isDragging = false;
                world.classList.remove('is-dragging');
                window.removeEventListener('mousemove', onDragMove);
                window.removeEventListener('mouseup', onDragEnd);
                window.removeEventListener('touchmove', onDragMove);
                window.removeEventListener('touchend', onDragEnd);
                if (Math.abs(velocity) > 0.1) {
                    inertiaAnimate();
                }
            };

            world.addEventListener('mousedown', onDragStart);
            world.addEventListener('touchstart', onDragStart, { passive: true });
        });
    </script>
</body>
</html>
