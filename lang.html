<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Carousel with Inertia</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .scene {
            width: 250px;
            height: 250px;
            perspective: 1000px;
        }

        .world {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            cursor: grab;
        }

        .world.is-dragging {
            cursor: grabbing;
        }

        .item {
            position: absolute;
            top: calc(50% - 25px); 
            left: calc(50% - 45px);
            width: 90px; 
            height: 50px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px; 
            
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            
            font-size: 14px; 
            font-weight: bold;
            cursor: pointer;
            
            transition: transform 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            backface-visibility: hidden;
            user-select: none;
        }
        
        .item:hover {
            background-color: rgba(217, 4, 41, 0.6);
            border-color: rgba(217, 4, 41, 1);
        }

        .flag-icon {
            width: 19px;
            height: 19px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* --- STYLOWANIE MOBILE FIRST --- */
        @media (max-width: 600px) {
            .scene {
                width: 220px;
                height: 220px;
                perspective: 700px; /* Zmniejszona perspektywa dla lepszego efektu */
            }

            /* Skalowanie samych paneli i ich zawartości */
            .item {
                width: 80px;
                height: 42px;
                top: calc(50% - 21px);  /* Połowa nowej wysokości */
                left: calc(50% - 40px); /* Połowa nowej szerokości */
                font-size: 12px;
                gap: 5px;
            }

            .flag-icon {
                width: 16px;
                height: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="world">
            </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const countries = [
                { code: 'br', name: 'Brazil (Portuguese)' },
                { code: 'cn', name: 'China (Mandarin)' },
                { code: 'cz', name: 'Czech Republic (Czech)' },
                { code: 'fr', name: 'France (French)' },
                { code: 'de', name: 'Germany (German)' },
                { code: 'in', name: 'India (Hindi)' },
                { code: 'id', name: 'Indonesia (Indonesian)' },
                { code: 'it', name: 'Italy (Italian)' },
                { code: 'jp', name: 'Japan (Japanese)' },
                { code: 'pl', name: 'Poland (Polish)' },
                { code: 'sg', name: 'Singapore (English)' },
                { code: 'sk', name: 'Slovakia (Slovak)' },
                { code: 'es', name: 'Spain (Spanish)' },
                { code: 'ua', name: 'Ukraine (Ukrainian)' },
                { code: 'us', name: 'USA (English)' }
            ];

            const world = document.querySelector('.world');
            const totalItems = countries.length;
            
            // Dynamiczny promień, lepiej dopasowany do mniejszej karuzeli
            const radius = window.innerWidth <= 600 ? 150 : 220;
            let hasDragged = false;

            countries.forEach((country, index) => {
                const item = document.createElement('div');
                item.className = 'item';

                const flagImg = document.createElement('img');
                flagImg.className = 'flag-icon';
                flagImg.src = `https://hatscripts.github.io/circle-flags/flags/${country.code}.svg`;
                flagImg.alt = '';
                flagImg.draggable = false;

                const codeSpan = document.createElement('span');
                codeSpan.innerText = country.code.toUpperCase();

                item.appendChild(flagImg);
                item.appendChild(codeSpan);

                const angle = (360 / totalItems) * index;
                item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                item.addEventListener('click', () => {
                    if (!hasDragged) {
                        alert(`Selected country: ${country.name}`);
                    }
                });
                world.appendChild(item);
            });

            // LOGIKA INTERAKCJI Z INERCJĄ (BEZ ZMIAN)
            
            let currentRotationY = 0;
            let isDragging = false;
            let startX = 0;
            let lastX = 0;
            let velocity = 0; 
            let animationFrame = null;
            const friction = 0.95;
            const rotationSensitivity = 0.4;

            const updateRotation = () => {
                world.style.transform = `rotateY(${currentRotationY}deg)`;
            };

            const inertiaAnimate = () => {
                currentRotationY += velocity;
                velocity *= friction;
                updateRotation();
                if (Math.abs(velocity) > 0.1) {
                    animationFrame = requestAnimationFrame(inertiaAnimate);
                } else {
                    velocity = 0;
                }
            };

            const onDragStart = (e) => {
                e.preventDefault();
                isDragging = true;
                hasDragged = false;
                world.classList.add('is-dragging');
                
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    velocity = 0;
                }
                
                startX = e.clientX || e.touches[0].clientX;
                lastX = startX;

                window.addEventListener('mousemove', onDragMove);
                window.addEventListener('mouseup', onDragEnd);
                window.addEventListener('touchmove', onDragMove);
                window.addEventListener('touchend', onDragEnd);
            };

            const onDragMove = (e) => {
                if (!isDragging) return;

                const currentX = e.clientX || e.touches[0].clientX;
                const deltaX = currentX - lastX;

                if (Math.abs(currentX - startX) > 5) {
                    hasDragged = true;
                }
                
                velocity = deltaX * rotationSensitivity;
                currentRotationY += velocity;
                lastX = currentX;

                updateRotation();
            };

            const onDragEnd = () => {
                isDragging = false;
                world.classList.remove('is-dragging');
                
                window.removeEventListener('mousemove', onDragMove);
                window.removeEventListener('mouseup', onDragEnd);
                window.removeEventListener('touchmove', onDragMove);
                window.removeEventListener('touchend', onDragEnd);

                if (Math.abs(velocity) > 0.1) {
                    inertiaAnimate();
                }
            };

            world.addEventListener('mousedown', onDragStart);
            world.addEventListener('touchstart', onDragStart, { passive: true });
        });
    </script>
</body>
</html>
