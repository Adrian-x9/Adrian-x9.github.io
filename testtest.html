<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Przykład ucinania tekstu</title>
  <style>
    .cut-text {
      width: 300px;           /* Szerokość kontenera */
      white-space: nowrap;    /* Nie łamie tekstu */
      overflow: hidden;       /* Ukrywa wystający tekst */
      text-overflow: clip;    /* Po prostu ucina */
      font-family: sans-serif;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="cut-text">To jest bardzo długa linijka tekstu, która się nie mieści w kontenerze.</div>
  <div class="cut-text">Druga linijka, również zbyt długa, ale nie łamie się i kończy się ostro.</div>
  <div class="cut-text">Trzecia linijka — krótka, więc widać ją całą.</div>

</body>
</html>
