<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Avanzado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* --- Estilos Base y de Fondo --- */
        :root {
            /* Colores dla trybu jasnego */
            --body-bg-light: #e1e1e1;
            --panel-bg-light: #f0f0f0;
            --panel-shadow-light: 0 0 0 2px #cc0000, 0 5px 20px rgba(204, 0, 0, 0.3);
            --group-bg-light: rgba(0, 0, 0, 0.05);
            --button-text-light: #333;
            --slider-icon-light: #888;
            --slider-track-light: rgba(0, 0, 0, 0.1);
            --slider-thumb-light: #cc0000;
            --slider-thumb-border-light: #fff;
            --button-red-bg-light: #cc0000;
            --button-red-text-light: white;
            --separator-light: rgba(0, 0, 0, 0.15);
            --filter-input-bg-light: #fff;
            --filter-input-border-light: #ccc;
            --status-text-light: #333;
            --status-bold-light: #000;

            /* Colores dla trybu ciemnego */
            --body-bg-dark: #121212;
            --panel-bg-dark: #1a1a1a;
            --panel-shadow-dark: 0 0 0 2px #e53935, 0 0 25px rgba(229, 57, 53, 0.5);
            --group-bg-dark: rgba(255, 255, 255, 0.1);
            --button-text-dark: #eee;
            --slider-icon-dark: #aaa;
            --slider-track-dark: rgba(255, 255, 255, 0.2);
            --slider-thumb-dark: #e53935;
            --slider-thumb-border-dark: #000;
            --button-red-bg-dark: #e53935;
            --button-red-text-dark: #111;
            --separator-dark: rgba(255, 255, 255, 0.15);
            --filter-input-bg-dark: #2c2c2c;
            --filter-input-border-dark: #555;
            --status-text-dark: #ccc;
            --status-bold-dark: #fff;
        }

        html {
            background-color: var(--body-bg-light);
            font-family: "Segoe UI", sans-serif;
            transition: background-color 0.5s ease;
        }

        html.dark-mode {
            background-color: var(--body-bg-dark);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinea al inicio para el panel superior */
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Estructura Principal del Panel de Control --- */
        .control-panel {
            display: flex;
            flex-direction: column; /* Organiza las filas una sobre otra */
            gap: 0; /* Control manual de espacios */
            width: 100%;
            max-width: 900px;
            padding: 8px;
            border: 2px solid transparent;
            border-radius: 12px;
            background-clip: padding-box;
            box-sizing: border-box;
            background-color: var(--panel-bg-light);
            box-shadow: var(--panel-shadow-light);
        }

        html.dark-mode .control-panel {
            background-color: var(--panel-bg-dark);
            box-shadow: var(--panel-shadow-dark);
        }

        /* --- Fila Superior (Filtry i Status) --- */
        .deck-top-row {
            display: grid;
            grid-template-columns: minmax(300px, 40%) 20px 1fr; /* Diseño de 3 columnas */
            gap: 10px;
            width: 100%;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--separator-light);
            transition: grid-template-columns 0.4s ease-in-out;
            min-height: 75px; /* POPRAWKA 5: Stabilizacja wysokości panelu */
            box-sizing: border-box;
        }
        
        html.dark-mode .deck-top-row {
            border-color: var(--separator-dark);
        }
        
        /* Stan rozszerzony kurtyny */
        .deck-top-row.filters-expanded {
            grid-template-columns: minmax(400px, 70%) 20px 1fr;
        }

        /* Sekcja Filtrów (Lewa) */
        .filter-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap; /* Evita que los elementos se desordenen */
            overflow: hidden; /* Oculta lo que no cabe */
        }

        .filter-section > * {
            flex-shrink: 0; /* Evita que los elementos se encojan durante la animación */
        }
        
        .filter-section input, .filter-section select, .filter-section .dir-db-btn {
            height: 38px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--filter-input-border-light);
            background-color: var(--filter-input-bg-light);
            color: var(--button-text-light);
            box-sizing: border-box;
        }

        html.dark-mode .filter-section input, html.dark-mode .filter-section select, html.dark-mode .filter-section .dir-db-btn {
            border-color: var(--filter-input-border-dark);
            background-color: var(--filter-input-bg-dark);
            color: var(--button-text-dark);
        }
        
        .filter-section #search { width: 160px; }
        .filter-section .file-input-label { display: none; } /* Oculto por defecto */

        .generator-group { display: flex; align-items: center; gap: 5px; }
        #generatorModeBtn, #minimizeBtn { width: 38px; padding: 0; }
        #generatorModeBtn i, #minimizeBtn i { margin: 0; }
        
        /* Uchwyt Kurtyny (Środek) */
        .curtain-handle {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            cursor: pointer;
        }
        
        #curtain-toggle-btn {
            background: rgba(128, 128, 128, 0.2);
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            padding: 0;
            color: #fff;
            z-index: 1;
            transition: transform 0.4s ease-in-out;
        }
        
        .deck-top-row.filters-expanded #curtain-toggle-btn {
            transform: rotate(180deg);
        }
        
        #curtain-toggle-btn i { margin: 0; font-size: 16px; }

        /* Sekcja Statusu (Prawa) */
        .status-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden; /* Zapobiega "wypadaniu" tekstu podczas animacji */
        }
        
        #statusBarIntegrated {
            display: flex;
            align-items: center;
            white-space: nowrap; /* Zapobiega łamaniu linii */
            color: var(--status-text-light);
            font-weight: 600;
        }
        
        html.dark-mode #statusBarIntegrated { color: var(--status-text-dark); }
        #statusBarIntegrated b { font-weight: 800; color: var(--status-bold-light); }
        html.dark-mode #statusBarIntegrated b { color: var(--status-bold-dark); }
        
        .status-segment {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .status-segment:not(:first-child)::before {
            content: ""; display: inline-block; width: 1px; height: 0.8em;
            background-color: var(--separator-light); margin: 0 0.8em;
        }
        html.dark-mode .status-segment:not(:first-child)::before { background-color: var(--separator-dark); }

        .status-section-bottom {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-top: 5px;
            border-top: 1px solid rgba(204, 0, 0, 0.5);
            width: 100%;
            justify-content: flex-end;
            color: var(--status-text-light);
        }
        
        html.dark-mode .status-section-bottom { color: var(--status-text-dark); }
        .system-info { font-size: 0.9em; font-weight: 600; white-space: nowrap; transition: opacity 0.3s ease, transform 0.3s ease; }
        .status-icons { display: flex; align-items: center; gap: 12px; }
        
        .status-icon-btn {
            background: none; border: none; color: inherit; opacity: 0.7;
            cursor: pointer; font-size: 1.1em; padding: 0; transition: opacity 0.2s ease, color 0.2s ease;
        }
        .status-icon-btn:hover { opacity: 1; color: #cc0000; }
        html.dark-mode .status-icon-btn:hover { color: #e53935; }

        /* --- POPRAWKA 4: Logika ukrywania dla widoku z rozwiniętymi filtrami --- */
        .deck-top-row.filters-expanded .system-info,
        .deck-top-row.filters-expanded #statusBarIntegrated .status-segment:nth-of-type(n+3) {
            opacity: 0;
            pointer-events: none;
            transform: translateX(10px);
        }

        .deck-top-row.filters-expanded .status-section-bottom {
            border-top-color: transparent; /* Ukrywamy linię, gdy nie ma nad nią tekstu */
            justify-content: center;
            width: auto;
            padding-top: 0;
        }


        /* --- Fila Dolna (Kontrolki Widoku) --- */
        .deck-bottom-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .display-panel-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--group-bg-light);
            padding: 6px;
            border-radius: 8px;
        }

        html.dark-mode .display-panel-group { background-color: var(--group-bg-dark); }
        .display-panel-group.slider-group { flex-grow: 1; flex-direction: column; padding: 5px 12px; min-width: 250px; }
        .display-panel-group:first-child, .display-panel-group:last-child { background: none; padding: 0; }
        
        .deck-bottom-row button {
            width: 48px; height: 48px; font-size: 1.2em; border: 1px solid transparent;
            border-radius: 8px; cursor: pointer; background-color: transparent;
            color: var(--button-text-light); transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        html.dark-mode .deck-bottom-row button { color: var(--button-text-dark); }

        .display-panel-group:first-child button, .deck-bottom-row button.play-accent {
            background-color: var(--button-red-bg-light); color: var(--button-red-text-light); font-weight: bold; border: none;
        }

        html.dark-mode .display-panel-group:first-child button, html.dark-mode .deck-bottom-row button.play-accent {
            background-color: var(--button-red-bg-dark); color: var(--button-red-text-dark);
        }
        
        .deck-bottom-row button.play-accent { box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        html.dark-mode .deck-bottom-row button.play-accent { box-shadow: 0 0 15px rgba(229, 57, 53, 0.6); }
        .deck-bottom-row button.play-accent:hover { animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 50% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); } }

        /* --- Style suwaków (Sliders) --- */
        .slider-control {
            display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; width: 100%;
        }
        .slider-control i { font-size: 1.2em; color: var(--slider-icon-light); }
        html.dark-mode .slider-control i { color: var(--slider-icon-dark); }
        .slider-control span {
            font-weight: bold; min-width: 45px; text-align: right; font-size: 0.9em;
            color: var(--button-text-light);
        }
        html.dark-mode .slider-control span { color: var(--button-text-dark); }
        .slider-control input[type="range"] {
            -webkit-appearance: none; appearance: none; height: 8px; background: var(--slider-track-light);
            outline: none; border-radius: 4px; cursor: pointer;
        }
        html.dark-mode .slider-control input[type="range"] { background: var(--slider-track-dark); }
        .slider-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: var(--slider-thumb-light); border: 2px solid var(--slider-thumb-border-light);
            cursor: pointer; transition: transform 0.2s;
        }
        html.dark-mode .slider-control input[type="range"]::-webkit-slider-thumb {
            background: var(--slider-thumb-dark); border-color: var(--slider-thumb-border-dark);
        }
        .slider-control input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }
        .slider-control input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%; background: var(--slider-thumb-light);
            border: 2px solid var(--slider-thumb-border-light); cursor: pointer; transition: transform 0.2s;
        }
        html.dark-mode .slider-control input[type="range"]::-moz-range-thumb {
            background: var(--slider-thumb-dark); border-color: var(--slider-thumb-border-dark);
        }
        .slider-control input[type="range"]::-moz-range-thumb:hover { transform: scale(1.1); }

    </style>
</head>
<body>

    <div class="control-panel">
        <div class="deck-top-row">
            <div class="filter-section">
                <label for="fileInput" class="dir-db-btn file-input-label"><i class="fas fa-upload"></i></label>
                <input type="text" id="search" placeholder="Szukaj pozycji..." />
                <select id="formatFilter">
                    <option value="">FILTR</option>
                </select>
                <select id="sortSelector">
                    <option value="" disabled selected>SORTUJ</option>
                    <option value="shuffle">Wymieszaj</option>
                </select>
                <div class="generator-group">
                    <select id="generator">
                        <option value="" disabled selected>LOSUJ</option>
                        <option value="5">Pozycji: 5</option>
                    </select>
                    <button id="generatorModeBtn" class="dir-db-btn" title="Tryb generatora"><i class="fas fa-filter"></i></button>
                </div>
                <button id="minimizeBtn" class="dir-db-btn" title="Minimalizuj interfejs"><i class="fas fa-chevron-up"></i></button>
            </div>

            <div class="curtain-handle">
                <button id="curtain-toggle-btn" title="Pokaż/ukryj filtry"></button>
            </div>

            <div class="status-section">
                <div id="statusBarIntegrated">
                    <span class="status-segment"><b>35</b> / 35 pozycji</span>
                    <span class="status-segment">20:07 2025-09-28</span>
                    <span class="status-segment">Księżyc 🌕︎</span>
                    <span class="status-segment">PL</span>
                </div>
                <div class="status-section-bottom">
                    <div class="system-info">
                        System <span style="color: #cc0000;">Visu</span>Dir v1.12.3
                    </div>
                    <div class="status-icons">
                        <a class="status-icon-btn" title="Informacje"><i class="fas fa-info-circle"></i></a>
                        <a class="status-icon-btn" title="Zmień język"><i class="fas fa-globe"></i></a>
                        <button class="status-icon-btn" title="Wycisz/Włącz wideo"><i class="fas fa-volume-mute"></i></button>
                        <button class="status-icon-btn" title="Pełny ekran"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="deck-bottom-row">
            <div class="display-panel-group">
                <button title="Zmień tryb widoku"><i class="fas fa-layer-group"></i></button>
                <button title="Filtruj wg orientacji"><i class="fas fa-images"></i></button>
            </div>
            <div class="display-panel-group slider-group">
                <div class="slider-control">
                    <i class="fas fa-th-large" title="Wielkość miniaturek"></i>
                    <input type="range" min="50" max="150" value="100" step="1">
                    <span>100%</span>
                </div>
                <div class="slider-control">
                    <i class="fas fa-grip-lines" title="Liczba wierszy"></i>
                    <input type="range" min="1" max="10" value="2" step="1">
                    <span>2</span>
                </div>
            </div>
            <div class="display-panel-group">
                <button id="theme-toggle-btn" title="Zmień motyw na ciemny/jasny"><i class="fas fa-moon"></i></button>
                <button class="play-accent" title="Rozpocznij pokaz slajdów"><i class="fas fa-play"></i></button>
            </div>
        </div>
    </div>

    <script>
        // --- Logika dla przycisku zmiany motywu (jasny/ciemny) ---
        const themeToggleButton = document.getElementById('theme-toggle-btn');
        const htmlElement = document.documentElement;

        themeToggleButton.addEventListener('click', () => {
            htmlElement.classList.toggle('dark-mode');
            const isDarkMode = htmlElement.classList.contains('dark-mode');
            const icon = themeToggleButton.querySelector('i');
            icon.className = isDarkMode ? 'fas fa-sun' : 'fas fa-moon';
        });

        // --- Logika dla przycisku kurtyny filtrów ---
        const curtainToggleButton = document.getElementById('curtain-toggle-btn');
        const topRow = document.querySelector('.deck-top-row');
        // Inicjalizacja ikony wewnątrz przycisku kurtyny, ponieważ jest pusta w HTML
        curtainToggleButton.innerHTML = '<i class="fas fa-chevron-right"></i>';


        curtainToggleButton.addEventListener('click', () => {
            topRow.classList.toggle('filters-expanded');
        });
    </script>

</body>
</html>
