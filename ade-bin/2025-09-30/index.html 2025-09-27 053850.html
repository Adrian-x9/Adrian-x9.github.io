        /* Preloader Styles */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        html:not(.dark-mode) #preloader {
            background-color: #e1e1e1;
        }

        html:not(.dark-mode) .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #cc0000;
        }

        html.dark-mode #preloader {
            background-color: #121212;
        }

        html.dark-mode .spinner {
            border: 5px solid #333;
            border-top: 5px solid #e53935;
        }

        #preloader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes spin {
            0% {

        .guide-list-wrapper {
            width: 90%;
            max-width: 1920px;
            margin: 0 auto;
            overflow: hidden;
            transition: height 0.5s ease-in-out;
        }

        .guide-list {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .guide-list::-webkit-scrollbar {
            display: none;
        }

        .guide-list-wrapper+.pagination {
            margin-top: 20px;
        }

        .guide-page {
            box-sizing: border-box;
            flex: 0 0 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: grid;
            grid-template-rows: repeat(var(--grid-rows, 4), 1fr);
            grid-template-columns: repeat(auto-fit, minmax(var(--box-width, 256px), 1fr));
            /* KLUCZOWA ZMIANA */
            justify-content: center;
            gap: 20px;
            padding: 2px;
            transition: grid-template-columns 0.5s ease;
            align-content: start;
            /* Dodana linia zapobiegająca rozciąganiu wierszy */
        }

        .guide-list.random-draw {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            overflow-x: hidden;
        }

        .guide-cover {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            margin: 10px auto 0;
            display: block;
            border-radius: 10px;
            transition: opacity 0.5s, max-height 0.5s, margin 0.5s, padding 0.5s, border-width 0.5s, transform 0.5s ease-in-out;
        }

        .guide .guide-cover {
            opacity: 1;
            transform: scale(1);
        }

        .guide-list.view-1 .guide-cover,
        .guide-list.hide-covers .guide-cover {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            transform: scale(0.7);
            overflow: hidden;
        }

        .guide-list.view-1 .guide {
            padding-top: 10px;
        }

        .guide-list.view-1 .guide .guide-title {
            margin-top: 0;
        }

        .guide-page:not(.only-covers) .guide.animate-in .guide-cover {
            transition: none;
            opacity: 0;
            transform: scale(0.7);
            animation: fadeInCover 0.5s 0.1s ease-out forwards;
        }

        @keyframes fadeInCover {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOutSlideOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .guide.animate-out {
            animation: fadeOutSlideOut 0.3s ease-in forwards;
        }

        .guide-title,
        .guide-info,
        .guide-content-bottom>a:not(.cover-link) {
            transition: opacity 0.5s, max-height 0.5s, margin 0.5s, padding 0.5s;
            overflow: hidden;
        }

        /* --- WIDOK ELEGANCKI (view-7) - OSTATNIE POPRAWKI --- */

        /* Ustawienia ogólne dla kafelka w tym trybie */
        /* 1. Podwajamy zaokrąglenie rogów głównego kafelka */

        .guide-list.view-7 .guide {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg));
            transition: transform 0.1s ease-out;
            border-radius: 20px;
            /* <-- Zwiększone zaokrąglenie */
            /* Płynny powrót */
        }

        /* Poświata dla efektu 3D */
        .guide-list.view-7 .guide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 50%),
                    rgba(229, 57, 53, 0.3),
                    transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease-out;
            z-index: 3;
            pointer-events: none;
        }

        .guide-list.view-7 .guide:hover::before {
            opacity: 1;
        }

        /* --- EASTER EGG: CRT Effect Styles --- */
        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10001;
            background: #111;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        html.dark-mode #crt-overlay {
            background: #eee;
        }

        #crt-overlay.active {
            opacity: 1;
            animation: crt-flicker 0.1s infinite, crt-collapse 1s 0.5s ease-out forwards;
        }

        #crt-overlay::before {
            content: ' ';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            animation: crt-scanline 2s linear infinite;
        }

        html.dark-mode #crt-overlay::before {
            background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(200, 200, 200, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 4px, 3px 100%;
        }


        @keyframes crt-flicker {
            0% {
                opacity: 0.95;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.98;
            }
        }

        @keyframes crt-scanline {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes crt-collapse {
            0% {
                transform: scale(1, 1);
            }

            30% {
                transform: scale(1.05, 1);

    <script>
        (function () {
            const langConfig = {
                defaultLanguage: 'pl',
                englishUrl: 'index-en.html'
            };
            try {
                let currentLang = localStorage.getItem('visudir_lang');
                if (!currentLang) {
                    currentLang = langConfig.defaultLanguage;
                    localStorage.setItem('visudir_lang', currentLang);
                }
                if (currentLang === 'en' && !window.location.pathname.endsWith(langConfig.englishUrl)) {
                    // window.location.replace(langConfig.englishUrl);
                }
            } catch (e) { /* Ignore storage errors */ }
        })();

        (function () {
            try {
                const theme = localStorage.getItem('visudir_theme');
                const defaultTheme = 'light';
                if ((theme === 'dark') || (!theme && defaultTheme === 'dark')) {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) { /* Ignore */ }
        })();

        function initializeMobileHover() {
            // Nasłuchuj dotknięć na całej liście okładek
            guideList.addEventListener('touchend', function (e) {
                LanguagetappedItem = e.target.closest('.guide');

                // Jeśli dotknięto czegoś poza kafelkiem, zresetuj stan
                if (!tappedItem) {
                    if (tappedGuide) {
                        tappedGuide.classList.remove('mobile-hover');
                        tappedGuide = null;
                    }
                    return;
                }

                // Zatrzymaj domyślną akcję (np. nawigację), aby obsłużyć ją ręcznie
                e.preventDefault();

                if (tappedGuide === tappedItem) {
                    // DRUGIE dotknięcie tego samego kafelka: wykonaj akcję kliknięcia
                    const link = tappedItem.querySelector('a');
                    if (link) {
                        link.click();
                    }
                    tappedGuide.classList.remove('mobile-hover');
                    tappedGuide = null;
                } else {
                    // PIERWSZE dotknięcie lub dotknięcie innego kafelka
                    // Zdejmij hover ze starego kafelka, jeśli istniał
                    if (tappedGuide) {
                        tappedGuide.classList.remove('mobile-hover');
                    }
                    // Ustaw hover na nowym kafelku
                    tappedItem.classList.add('mobile-hover');
                    tappedGuide = tappedItem;
                }
            });

            // Dodajmy też reset po kliknięciu gdziekolwiek indziej na stronie
            document.addEventListener('touchstart', function (e) {
                if (!e.target.closest('.guide') && tappedGuide) {
                    tappedGuide.classList.remove('mobile-hover');
                    tappedGuide = null;
                }
            });
        }
    </script>
