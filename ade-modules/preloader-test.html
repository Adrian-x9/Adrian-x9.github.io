<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisuDir Preloader Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    .preloader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: bgCycle 8s infinite;
      background: radial-gradient(circle at center, #121212 0%, #1e1e1e 100%);
    }

    @keyframes bgCycle {
      0%   { background: radial-gradient(circle at center, #121212 0%, #1e1e1e 100%); }
      50%  { background: radial-gradient(circle at top left, #ffffff 0%, #f0f0f0 100%); }
      100% { background: radial-gradient(circle at center, #121212 0%, #1e1e1e 100%); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 20px);
      grid-gap: 10px;
      margin-bottom: 20px;
    }

    .grid div {
      width: 20px;
      height: 20px;
      background-color: #e53935;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .grid div:nth-child(odd) {
      animation-delay: 0.2s;
    }

    .grid div:nth-child(even) {
      animation-delay: 0.4s;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .caption {
      font-size: 1.2rem;
      color: #e53935;
      animation: fadeText 8s infinite;
    }

    @keyframes fadeText {
      0%, 100% { opacity: 1; color: #e53935; }
      50% { opacity: 0.6; color: #333; }
    }
  </style>
</head>
<body>
  <div class="preloader">
    <div class="grid">
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
      <div></div><div></div><div></div>
    </div>
    <div class="caption">VisuDir v1.12.1</div>
  </div>
</body>
</html>
