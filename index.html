        #preloader {

        .guide-list-wrapper {

            max-width: 1920px;

        .guide-list {

            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;

            grid-template-rows: repeat(var(--grid-rows, 4), 1fr);
            grid-template-columns: repeat(auto-fill, minmax(var(--box-width, 256px), 1fr));
            justify-content: center;
            gap: 20px;

        @keyframes fadeInCover {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeOutSlideOut {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(20px);
            }
        }

        .guide.animate-out {

        }

        /* --- WIDOK ELEGANCKI (view-image-only) - OSTATNIE POPRAWKI --- */

        /* Ustawienia ogólne dla kafelka w tym trybie */
        /* 1. Podwajamy zaokrąglenie rogów głównego kafelka */

        .guide-list.view-image-only .guide {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(var(--rotate-x, 0deg)) rotateY(var(--rotate-y, 0deg));
            transition: transform 0.1s ease-out;
            border-radius: 20px;
            /* <-- Zwiększone zaokrąglenie */
            /* Płynny powrót */
        }

        /* Poświata dla efektu 3D */
        .guide-list.view-image-only .guide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 50%),
                    rgba(229, 57, 53, 0.3),
                    transparent 40%);
            opacity: 0;
            transition: opacity 0.3s ease-out;
            z-index: 3;
            pointer-events: none;
        }

        .guide-list.view-image-only .guide:hover::before {
            opacity: 1;
        }

        /* 2. Przywracamy oryginalne zachowanie kontenera obrazka (bez flexboxa i tła) */
        .guide-list.view-image-only .guide-cover-wrapper {
            height: 65%;

            position: relative;

        /* Usuwamy niepotrzebne tło dla trybu ciemnego */
        body.dark-mode .guide-list.view-image-only .guide-cover-wrapper {

        }

        .guide-list.view-image-only .guide-cover-wrapper .cover-link {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;

            height: 100%;
            object-fit: cover;

            transition: transform 0.4s ease-out;
            /* Usuwamy stylizację z samego obrazka, bo ramką jest teraz cały kafelek */
            border-radius: 0;
            box-shadow: none;
            /* display: block;
            max-width: 100%;
            max-height: 100%;

        /* --- WIDOK SIATKA (GRID) v1.0 - OSTATECZNA WERSJA --- */

        /* 1. Kontener ".guide" staje się całkowicie przezroczysty i niewidoczny */
        .guide-list.view-grid .guide {
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: transparent !important;
            /* Używamy !important, by mieć pewność */
            box-shadow: none !important;
            /* że żadna inna reguła go nie nadpisze */
            border: none !important;
        }

        /* 2. Zdjęcie otrzymuje własną ramkę, cień i nie jest przycinane */
        .guide-cover-grid {
            /* Zamiast wymuszać 100% wymiarów, pozwalamy obrazkowi się skalować */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease-out, box-shadow 0.3s ease-out;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            background-color: rgba(0, 0, 0, 0.03);
        }

        body.dark-mode .guide-cover-grid {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* 3. Nakładka z tekstem ma płynne przejście i zaokrąglone rogi pasujące do zdjęcia */
        .guide-list.view-grid .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 8px;
            /* Dopasowanie do rogów zdjęcia */
            pointer-events: none;
            /* Nakładka nie przechwytuje zdarzeń myszy */
        }

        /* 4. Tekst na nakładce ma pogrubienie i otoczkę */
        .grid-overlay .grid-title-text a {
            color: #fff;
            font-size: 1.2em;
            font-weight: 800;
            text-decoration: none;
            -webkit-text-stroke: 1px black;
            paint-order: stroke fill;
        }

        /* 5. Efekt HOVER działa teraz na całym obszarze kafelka, ale wizualnie dotyczy zdjęcia */
        .guide-list.view-grid .guide:hover .grid-overlay {
            opacity: 1;
        }

        .guide-list.view-grid .guide:hover .guide-cover-grid {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);

        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10001;
            background: #111;
            opacity: 0;
            pointer-events: none;

        html.dark-mode #crt-overlay {

        }

        #crt-overlay.active {
            opacity: 1;
            animation: crt-flicker 0.1s infinite, crt-collapse 1s 0.5s ease-out forwards;
        }

        #crt-overlay::before {
            content: ' ';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            animation: crt-scanline 2s linear infinite;
        }

        html.dark-mode #crt-overlay::before {
            background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(200, 200, 200, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 4px, 3px 100%;
        }


        @keyframes crt-flicker {
            0% {
                opacity: 0.95;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.98;
            }
        }

        @keyframes crt-scanline {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes crt-collapse {
            0% {
                transform: scale(1, 1);
            }

            30% {
                transform: scale(1.05, 1);
            }

            80% {
                transform: scale(0.001, 1);
                opacity: 1;
            }

            100% {
                transform: scale(0.001, 0);
                opacity: 0;
            }
        }

        function initializeMobileHover() {
            // Nasłuchuj dotknięć na całej liście okładek
            guideList.addEventListener('touchend', function (e) {
                const tappedItem = e.target.closest('.guide');

                // Jeśli dotknięto czegoś poza kafelkiem, zresetuj stan
                if (!tappedItem) {
                    if (tappedGuide) {
                        tappedGuide.classList.remove('mobile-hover');
                        tappedGuide = null;
                    }
                    return;
                }

                // Zatrzymaj domyślną akcję (np. nawigację), aby obsłużyć ją ręcznie
                e.preventDefault();

                if (tappedGuide === tappedItem) {
                    // DRUGIE dotknięcie tego samego kafelka: wykonaj akcję kliknięcia
                    const link = tappedItem.querySelector('a');
                    if (link) {
                        link.click();
                    }
                    tappedGuide.classList.remove('mobile-hover');
                    tappedGuide = null;
                } else {
                    // PIERWSZE dotknięcie lub dotknięcie innego kafelka
                    // Zdejmij hover ze starego kafelka, jeśli istniał
                    if (tappedGuide) {
                        tappedGuide.classList.remove('mobile-hover');
                    }
                    // Ustaw hover na nowym kafelku
                    tappedItem.classList.add('mobile-hover');
                    tappedGuide = tappedItem;
                }
            });

            // Dodajmy też reset po kliknięciu gdziekolwiek indziej na stronie
            document.addEventListener('touchstart', function (e) {
                if (!e.target.closest('.guide') && tappedGuide) {
                    tappedGuide.classList.remove('mobile-hover');
                    tappedGuide = null;
                }
            });
        }

                const isRetry = sessionStorage.getItem('visudir_load_retry');

                const loadTimeout = setTimeout(() => {
                    if (isRetry) {
                        // Second failure: inform user
                        document.getElementById('preloader').innerHTML = 'Aplikacja nie może się załadować.<br>Proszę spróbować wyczyścić dane przeglądarki lub skontaktować się z administratorem.';
                    } else {
                        // First failure: clear storage and retry
                        sessionStorage.setItem('visudir_load_retry', 'true');
                        Object.keys(localStorage).forEach(key => {
                            if (key.startsWith('visudir_')) {
                                localStorage.removeItem(key);
                            }
                        });
                        location.reload();
                    }
                }, 8000); // 8-second timeout

                window.addEventListener('load', () => {
                    clearTimeout(loadTimeout);
                    sessionStorage.removeItem('visudir_load_retry');
                });

            } catch (e) {
                console.error("Critical error in startup safety mechanism.", e);

            // Initial theme setup (SAFE VERSION)

                const theme = localStorage.getItem('visudir_theme');

        function initializeTheme() {

            const isDark = theme === 'dark';

            if (!storedTheme) {

            return theme;

        function initializeBackgroundVideo(theme) {
            const pageKey = config.pageSettings.pageKey;
            const storageKey = `visudir_bg_video_${pageKey}`;
            const storedVideoNum = localStorage.getItem(storageKey);
            let videoNum = parseInt(storedVideoNum) || config.pageSettings.defaultBgVideo;
            if (videoNum < config.pageSettings.bgVideoStartNum || videoNum > config.pageSettings.bgVideoEndNum) {
                videoNum = config.pageSettings.defaultBgVideo;
            }
            if (bgVideo && bgVideoSource) {
                const videoUrlBase = theme === 'light' ? config.paths.videoBgLightUrlBase : config.paths.videoBgDarkUrlBase;
                const videoSrc = `${videoUrlBase}${videoNum}.mp4`;
                bgVideoSource.src = videoSrc;
                // FIX: Zmiana load() na play() i obsługa błędu AbortError
                bgVideo.load();
                const playPromise = bgVideo.play();
                if (playPromise !== undefined) {
                    playPromise.catch(error => {
                        if (error.name !== 'AbortError') {
                            console.error("Błąd odtwarzania wideo:", error);
                        }
                    });
                }

                bgVideo.addEventListener("canplay", () => {
                    document.body.classList.add("video-ready");
                }, {
                    once: true
                });
            }
            if (!storedVideoNum || parseInt(storedVideoNum) !== videoNum) {
                localStorage.setItem(storageKey, videoNum);
            }
        }

        function getFileExtension(filename) {
            return filename.slice(((filename.lastIndexOf(".") - 1) >>> 0) + 2).toLowerCase();
        }

        function normalizeUrl(url) {
            const trimmedUrl = url.trim();
            if (trimmedUrl.startsWith('http://') || trimmedUrl.startsWith('https://') || trimmedUrl.startsWith('./') || trimmedUrl.startsWith('../') || trimmedUrl.startsWith('/')) {
                return trimmedUrl;
            }
            return `https://${trimmedUrl}`;
        }

        function decodeUrlFromFilename(filename) {
            let urlPart = filename.split('$$')[0];
            urlPart = urlPart.replace(/\.link$/i, '');
            urlPart = urlPart.replace(/#/g, '/');
            urlPart = urlPart.replace(/&&/g, '?');
            return normalizeUrl(urlPart);
        }

        function parseGuideTitle(filename) {
            const baseName = filename.replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, '').trim();
            const parts = baseName.split('$$');
            if (getFileExtension(filename) === 'link' && parts.length > 1) {
                return {
                    title: decodeURIComponent(parts[1] || ''),
                    offlineDesc: decodeURIComponent(parts[2] || null)
                };
            }
            const title = decodeURIComponent(parts[0].replace(/_/g, ' ').replace(/-/g, ' ')).replace(/\s*-\s*Poradnik(?:_do_gry)?\s*(?:GRY-OnLine|Gry-OnLine)?\s*/i, '').trim();
            return {
                title: title,
                offlineDesc: null
            };
        }

        function createDateFromStrings(dateStr, timeStr) {
            const [day, month, year] = dateStr.split('.').map(Number);
            const [hours, minutes] = timeStr.split(':').map(Number);
            return new Date(year, month - 1, day, hours, minutes);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function applySort(sortType, array) {
            currentSort = sortType;
            switch (sortType) {
                case "shuffle":
                    shuffleArray(array);
                    break;
                case "nameAsc":
                    array.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case "nameDesc":
                    array.sort((a, b) => b.title.localeCompare(a.title));
                    break;
                case "dateAsc":
                    array.sort((a, b) => a.timestamp - b.timestamp);
                    break;
                case "dateDesc":
                    array.sort((a, b) => b.timestamp - a.timestamp);
                    break;
                case "sizeAsc":
                    array.sort((a, b) => parseFloat(a.sizeMB) - parseFloat(b.sizeMB));
                    break;
                case "sizeDesc":
                    array.sort((a, b) => parseFloat(b.sizeMB) - parseFloat(a.sizeMB));
                    break;
            }
        }

        function getGuideOrientation(guide) {
            return new Promise((resolve) => {
                const f = guide.file.replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "").split("$$")[0];
                const coverUrl = `${config.paths.coversFolderName}/${encodeURIComponent(f)}.jpg`;
                if (guideDimensionsCache[coverUrl]) {
                    guide.orientation = guideDimensionsCache[coverUrl];
                    resolve();
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    guide.orientation = (img.naturalHeight > img.naturalWidth) ? 'vertical' : 'horizontal';
                    guideDimensionsCache[coverUrl] = guide.orientation;
                    resolve();
                };
                img.onerror = () => {
                    guide.orientation = 'unknown';
                    guideDimensionsCache[coverUrl] = 'unknown';
                    resolve();
                };
                img.src = coverUrl;
            });
        }

        async function processData(text) {
            const lines = text.split(/\r?\n/);
            guides = [];
            for (const line of lines) {
                const match = line.match(/^(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})\s+((?:<DIR>)|\d+)\s+(.+)$/i);
                if (match) {
                    const date = match[1];
                    const time = match[2];
                    const sizeOrDir = match[3];
                    const filename = match[4];
                    const format = getFileExtension(filename);
                    let sizeBytes = 0;
                    if (sizeOrDir !== '<DIR>') {
                        sizeBytes = parseInt(sizeOrDir);
                    }
                    if (sizeBytes === 0 && format !== 'link') continue;
                    const sizeMB = (sizeBytes / (1024 * 1024)).toFixed(2);
                    const {
                        title,
                        offlineDesc
                    } = parseGuideTitle(filename);
                    let linkData = {
                        description: offlineDesc
                    };
                    if (format === 'link' && !isOffline) {
                        try {
                            const response = await fetch(`${config.paths.dataFolderName}/${filename}`);
                            if (response.ok) {
                                linkData.description = await response.text();
                            } else if (!offlineDesc) {
                                linkData.description = 'Błąd wczytywania opisu.';
                            }
                        } catch (e) {
                            if (!offlineDesc) linkData.description = 'Błąd wczytywania opisu.';
                        }
                    }
                    guides.push({
                        title,
                        format,
                        file: filename,
                        sizeMB,
                        date,
                        time,
                        timestamp: createDateFromStrings(date, time).getTime(),
                        linkData,
                        orientation: 'pending'
                    });
                }
            }
            const orientationPromises = guides
                .filter(guide => ['jpg', 'png', 'link', 'mp4', 'avi'].includes(guide.format))
                .map(guide => getGuideOrientation(guide));
            await Promise.all(orientationPromises);
        }

            let search = searchInput.value.toLowerCase();

            let format = formatValue;
            if (formatValue.startsWith("search:")) {
                search = formatValue.substring(7).toLowerCase();
                format = "";
            }
            filteredGuides = guides.filter(g => {
                const inTitle = g.title.toLowerCase().includes(search);
                const inDescription = g.linkData.description && g.linkData.description.toLowerCase().includes(search);
                const searchMatch = inTitle || inDescription;
                const formatMatch = !format || g.format === format;
                const orientationMatch = !orientationFilterState || g.orientation === orientationFilterState;
                return searchMatch && formatMatch && orientationMatch;
            });
            slideshowSourceGuides = filteredGuides;
            stopCarousel();
        }

        async function init(data) {
            fileInputLabel.style.display = "none";
            await processData(data);
            updateFormatFilter();

            const generatorSelect = document.getElementById('generator');
            config.pageSettings.generatorOptions.forEach(num => {
                const option = document.createElement('option');
                option.value = num;
                option.textContent = lang.generatorItem.replace('{count}', num);
                generatorSelect.appendChild(option);

            applySort(currentSort, guides);

            const searchQuery = urlParams.get('search');
            if (searchQuery) {
                searchInput.value = decodeURIComponent(searchQuery);
            }
            const defaultFormat = config.pageSettings.defaultFormat || "";
            formatFilter.value = (getFromLocalStorage('format') || defaultFormat).toLowerCase();

        function startLogoRotator() {
            const initialLogo = config.logoRotator.logos[currentLogoIndex];
            if (!initialLogo) return;
            const isDark = document.documentElement.classList.contains('dark-mode');
            headerLogo.src = isDark ? initialLogo.srcDark : initialLogo.srcLight;
            logoLink.href = initialLogo.href;
            headerLogo.alt = initialLogo.alt;
            if (!config.logoRotator || !config.logoRotator.enabled || config.logoRotator.logos.length < 2) {
                return;
            }
            clearInterval(logoInterval);
            logoInterval = setInterval(() => {
                headerLogo.style.transform = 'rotateY(90deg)';
                setTimeout(() => {
                    currentLogoIndex = (currentLogoIndex + 1) % config.logoRotator.logos.length;
                    const newLogo = config.logoRotator.logos[currentLogoIndex];
                    const isDarkNow = document.documentElement.classList.contains('dark-mode');
                    headerLogo.src = isDarkNow ? newLogo.srcDark : newLogo.srcLight;
                    headerLogo.alt = newLogo.alt;
                    logoLink.href = newLogo.href;
                    headerLogo.style.transform = 'rotateY(0deg)';
                }, 300);
            }, config.logoRotator.interval);
        }

        function checkFileAndOpen(targetUrl, fallbackUrl, isLink = false) {
            if (targetUrl.startsWith('http')) {
                window.open(targetUrl, '_blank');
                return;
            }

            if (isOffline) {
                window.open(targetUrl, '_blank');
                return;
            }

            const [filePath] = targetUrl.split('?');

            fetch(filePath, {
                method: 'HEAD',
                cache: 'no-store'
            })
                .then(response => {
                    if (response.ok) {
                        window.open(targetUrl, '_blank');
                    } else {
                        window.location.href = fallbackUrl;
                    }
                })
                .catch(() => {
                    window.location.href = fallbackUrl;
                });
        }

        function createGuideHtml(guide) {
            const f = guide.file.replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "").split("$$")[0],
                u = `${config.paths.dataFolderName}/${encodeURIComponent(guide.file)}`,
                c = `${config.paths.coversFolderName}/${encodeURIComponent(f)}.jpg`;
            let titleHtml = "",
                infoHtml = "",
                actionLinkHtml = "",
                coverLinkHtml = "";
            let titleText = guide.title;
            if (guide.format === "link" && /^\d{2}\s*/.test(titleText))
                titleText = titleText.replace(/^\d{2}\s*/, "");

            const mediaTypes = ["jpg", "png", "mp4", "avi"];

            if (guide.format === "link") {
                const targetUrl = decodeUrlFromFilename(guide.file);
                const clickAction = `checkFileAndOpen('${targetUrl.replace(/'/g, "\\'")}', '${config.paths.urlFallback}', true); return false;`;
                titleHtml = `<div class="guide-title"><a href="${targetUrl}" onclick="${clickAction}">${titleText}</a></div>`;
                infoHtml = `<div class="guide-info">${guide.linkData.description || ""}</div>`;
                actionLinkHtml = `<a href="${targetUrl}" onclick="${clickAction}"><i class="fas fa-external-link-alt"></i> ${lang.guideBtnOpen}</a>`;
                coverLinkHtml = `<a href="${targetUrl}" onclick="${clickAction}" class="cover-link"></a>`;
            } else if (mediaTypes.includes(guide.format)) {
                const clickAction = `startSlideshowFrom('${guide.file.replace(/'/g, "\\'")}'); return false;`;
                titleHtml = `<div class="guide-title"><a href="#" onclick="${clickAction}">${titleText}</a></div>`;
                infoHtml = `<div class="guide-info"><i class="fas fa-calendar-alt"></i> ${guide.date} ${guide.time}<br><i class="fas fa-file-alt"></i> ${lang.guideInfoFormat}: ${guide.format.toUpperCase()}<br><i class="fas fa-database"></i> ${lang.guideInfoSize}: ${guide.sizeMB} MB</div>`;
                actionLinkHtml = `<a href="#" onclick="${clickAction}"><i class="fas fa-eye"></i> ${lang.guideBtnView}</a>`;
                coverLinkHtml = `<a href="#" onclick="${clickAction}" class="cover-link"></a>`;
            } else {
                const clickAction = `checkFileAndOpen('${u.replace(/'/g, "\\'")}', '${config.paths.urlFallback}'); return false;`;
                titleHtml = `<div class="guide-title">${titleText}</div>`;
                infoHtml = `<div class="guide-info"><i class="fas fa-calendar-alt"></i> ${guide.date} ${guide.time}<br><i class="fas fa-file-alt"></i> ${lang.guideInfoFormat}: ${guide.format.toUpperCase()}<br><i class="fas fa-database"></i> ${lang.guideInfoSize}: ${guide.sizeMB} MB</div>`;
                if (guide.format === "pdf") {
                    actionLinkHtml = `<a href="${u}" onclick="${clickAction}"><i class="fas fa-file-pdf"></i> ${lang.guideBtnOpen}</a>`;
                    coverLinkHtml = `<a href="#" onclick="${clickAction}" class="cover-link"></a>`;
                } else {
                    actionLinkHtml = `<a href="${u}" download><i class="fas fa-download"></i> ${lang.guideBtnDownload}</a>`;
                    coverLinkHtml = `<a href="${u}" download class="cover-link"></a>`;
                }
            }

            const noCoverImg = document.documentElement.classList.contains("dark-mode") ? ".base-system/gfx/no_cover_dark.png" : ".base-system/gfx/no_cover_light.png";

            if (currentViewMode === 'image-only') {
                const elegantCoverImgHtml = `<img src="${c}" alt="Okładka: ${titleText}" class="guide-cover-elegant" onerror="this.onerror=null;this.src='${noCoverImg}';this.classList.add('placeholder-cover');">`;
                return `
                    <div class="guide-cover-wrapper">
                        ${elegantCoverImgHtml}
                        ${coverLinkHtml} 
                    </div>
                    <div class="guide-text-content">
                        ${titleHtml}
                        <div class="guide-action-link">${actionLinkHtml}</div>
                    </div>
                `;
            } else if (currentViewMode === 'grid') {
                const gridCoverImgHtml = `<img src="${c}" alt="Okładka: ${titleText}" class="guide-cover-grid" onerror="this.onerror=null;this.src='${noCoverImg}';this.classList.add('placeholder-cover');">`;
                const onclickAction = (coverLinkHtml.match(/onclick="([^"]*)"/) || [])[1] || '';
                const hrefAction = (coverLinkHtml.match(/href="([^"]*)"/) || [])[1] || '#';

                return `
                    <a href="${hrefAction}" onclick="${onclickAction}">
                        ${gridCoverImgHtml}
                        <div class="grid-overlay">
                            <span class="grid-title-text">${titleText}</span>
                        </div>
                    </a>
                `;
            } else { // Obejmuje widok 'full', 'text-only' i 'masonry'
                const defaultCoverImgHtml = `<img src="${c}" alt="Okładka: ${titleText}" class="guide-cover" onerror="this.onerror=null;this.src='${noCoverImg}';this.classList.add('placeholder-cover');this.style.opacity=1;this.style.transform='scale(1)';">`;
                return `
                    ${titleHtml}
                    <div class="guide-content-bottom">
                        <div class="guide-info-container">${infoHtml}</div>
                        <a href="#" class="cover-link" onclick="${(coverLinkHtml.match(/onclick="([^"]*)"/) || [])[1] || ''}">${defaultCoverImgHtml}</a>
                        ${actionLinkHtml}
                    </div>
                `;

        const goToPage = (pageNum) => {
            pageNum = Math.max(1, Math.min(totalPages, pageNum));
            const targetScrollLeft = guideList.clientWidth * (pageNum - 1);
            guideList.scrollTo({
                left: targetScrollLeft,
                behavior: 'smooth'
            });
        };

        function renderGuides(sourceArray = null) {
            stopCarousel();
            const source = sourceArray || (generatorMode === 'visible' && generatedGuides) || filteredGuides;

            guideList.classList.remove('random-draw');
            if (sourceArray) {
                guideList.classList.add('random-draw');
            }

            guideList.classList.toggle('view-image-only', currentViewMode === 'image-only');
            guideList.classList.toggle('view-grid', currentViewMode === 'grid');
            guideList.classList.toggle('view-masonry', currentViewMode === 'masonry');
            guideList.classList.toggle('view-text-only', currentViewMode === 'text-only');

            guideList.innerHTML = "";
            if (lazyLoadObserver) lazyLoadObserver.disconnect();

            const sizePercent = document.getElementById('sizeSlider').value;
            const newWidth = Math.floor(config.pageSettings.baseBoxWidth * (sizePercent / 100));
            const minSlider = 50,
                maxSlider = 150;
            const minFont = 0.8,
                maxFont = 1.3;

            const percent = (sizePercent - minSlider) / (maxSlider - minSlider);

            const dynamicFontSize = minFont + (percent * (maxFont - minFont));
            guideList.style.setProperty('--dynamic-font-size', `${dynamicFontSize.toFixed(2)}rem`);
            guideList.style.setProperty('--grid-rows', selectedRowCount);
            guideList.style.setProperty('--box-width', `${newWidth}px`);

            const wrapper = document.querySelector('.guide-list-wrapper');
            const guideGap = 20;
            const estimatedItemHeight = config.pageSettings.estimatedItemHeight;

            if (sourceArray) {
                source.forEach((guide, index) => {
                    const div = document.createElement("div");
                    div.className = "guide animate-in";
                    div.style.animationDelay = `${index * 0.04}s`;
                    div.innerHTML = createGuideHtml(guide);
                    guideList.appendChild(div);
                });
                requestAnimationFrame(() => {
                    void guideList.offsetWidth;
                });
                pagination.classList.remove('visible');
                document.getElementById("guideCountDisplay").innerHTML = lang.guideCounter.replace('{count}', source.length).replace('{total}', guides.length);
                return;
            }

            const itemWidth = newWidth;
            const columns = Math.floor(((guideList.clientWidth + guideGap) / (itemWidth + guideGap)) + 0.0001) || 1;
            const itemsPerPage = columns * selectedRowCount;

            pagesCache = [];
            if (itemsPerPage > 0) {
                for (let i = 0; i < source.length; i += itemsPerPage) {
                    pagesCache.push(source.slice(i, i + itemsPerPage));
                }
            } else if (source.length > 0) {
                pagesCache.push(source);
            }
            totalPages = pagesCache.length || 1;

            pagesCache.forEach((pageItems, pageIndex) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'guide-page';
                pageDiv.dataset.pageNumber = pageIndex + 1;

                if (pageIndex === 0) {
                    pageItems.forEach((guide, index) => {
                        const div = document.createElement("div");
                        div.className = "guide";
                        if (isInitialLoad) {
                            div.classList.add("animate-in");
                            div.style.animationDelay = `${index * 0.04}s`;
                        }
                        div.innerHTML = createGuideHtml(guide);
                        pageDiv.appendChild(div);
                    });
                }
                guideList.appendChild(pageDiv);
            });

            setupLazyLoading(pagesCache);
            renderPagination();
            document.getElementById("guideCountDisplay").innerHTML = lang.guideCounter.replace('{count}', source.length).replace('{total}', guides.length);

            if (isInitialLoad) {
                isInitialLoad = false;
                preloadNextPageImages();
            }

            if (currentViewMode === 'masonry') {
                setTimeout(() => applyMasonryLayout(), 100);
            }

            updateWrapperHeightForPage(1);
        }

        function setupLazyLoading(pages) {
            if (lazyLoadObserver) lazyLoadObserver.disconnect();

            lazyLoadObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageDiv = entry.target;
                        const pageNum = parseInt(pageDiv.dataset.pageNumber, 10);

                        if (pageDiv.childElementCount === 0 && pageNum > 1) {
                            const pageItems = pages[pageNum - 1];
                            if (pageItems) {
                                requestAnimationFrame(() => {
                                    pageItems.forEach((guide, index) => {
                                        const div = document.createElement("div");
                                        div.className = "guide";
                                        div.innerHTML = createGuideHtml(guide);
                                        pageDiv.appendChild(div);
                                    });
                                    // Uruchomienie Masonry dla nowo załadowanej strony
                                    if (currentViewMode === 'masonry' && pageNum > 1) {
                                        setTimeout(() => applyMasonryLayout(pageNum), 50);
                                    }
                                });
                            }
                        }
                        observer.unobserve(pageDiv);
                    }
                });
            }, {
                root: guideList,
                rootMargin: '0px 300px 0px 300px'
            });

            document.querySelectorAll('.guide-page').forEach(page => {
                lazyLoadObserver.observe(page);
            });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');

            paginationContainer.innerHTML = `
                <div class="pagination-controls">
                    <button id="firstPageBtn" title="${lang.paginationFirst}"><i class="fas fa-fast-backward"></i></button>
                    <button id="prevPageBtn" title="${lang.paginationPrev}"><i class="fas fa-chevron-left"></i></button>
                    <button id="paginationResetBtn" class="pagination-action-btn" title="${lang.paginationReset}"><i class="fas fa-undo"></i></button>
                    <div class="pagination-center">
                        <div class="page-info">
                            <input type="number" id="pageInput" min="1" value="1" class="page-input">
                            <span id="pageInfoText" class="page-info-text">/ 1</span>
                        </div>
                        <input type="range" id="pageSlider" min="1" max="1" value="1" class="page-slider">
                    </div>
                    <button id="paginationCarouselBtn" class="pagination-action-btn" title="${lang.paginationCarouselStart}"><i class="fas fa-play"></i></button>
                    <button id="nextPageBtn" title="${lang.paginationNext}"><i class="fas fa-chevron-right"></i></button>
                    <button id="lastPageBtn" title="${lang.paginationLast}"><i class="fas fa-fast-forward"></i></button>
                </div>
            `;

            const controls = paginationContainer.querySelector('.pagination-controls');

            if (totalPages <= 1) {
                paginationContainer.classList.remove('visible');
                controls.style.display = 'none';
                return;
            }

            paginationContainer.classList.add('visible', 'animated-pagination');
            controls.style.display = 'flex';

            const firstPageBtn = document.getElementById('firstPageBtn');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const lastPageBtn = document.getElementById('lastPageBtn');
            const pageInput = document.getElementById('pageInput');
            const pageSlider = document.getElementById('pageSlider');
            const pageInfoText = document.getElementById('pageInfoText');
            document.getElementById('paginationResetBtn').onclick = () => {
                stopCarousel();
                goToPage(1);
            };
            document.getElementById('paginationCarouselBtn').onclick = toggleCarousel;

            const updateControls = (pageNum) => {
                pageInfoText.textContent = `/ ${totalPages}`;
                pageInput.value = pageNum;
                pageInput.max = totalPages;
                pageSlider.value = pageNum;
                pageSlider.max = totalPages;

                firstPageBtn.disabled = prevPageBtn.disabled = (pageNum <= 1);
                lastPageBtn.disabled = nextPageBtn.disabled = (pageNum >= totalPages);

                preloadNextPageImages();
            };

            firstPageBtn.onclick = () => {
                stopCarousel();
                goToPage(1);
            };
            prevPageBtn.onclick = () => {
                stopCarousel();
                goToPage(currentPage - 1);
            };
            nextPageBtn.onclick = () => {
                stopCarousel();
                goToPage(currentPage + 1);
            };
            lastPageBtn.onclick = () => {
                stopCarousel();
                goToPage(totalPages);
            };

            pageSlider.addEventListener('input', () => {
                stopCarousel();
                pageInput.value = pageSlider.value;
            });
            pageSlider.addEventListener('change', () => goToPage(parseInt(pageSlider.value, 10)));

            pageInput.addEventListener('change', () => {
                stopCarousel();
                goToPage(parseInt(pageInput.value, 10));
            });
            pageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    stopCarousel();
                    e.preventDefault();
                    goToPage(parseInt(pageInput.value, 10));
                    pageInput.blur();
                }
            });

            const paginationObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNum = parseInt(entry.target.dataset.pageNumber, 10);
                        currentPage = pageNum;
                        updateControls(pageNum);
                        updateWrapperHeightForPage(pageNum);
                    }
                });
            }, {
                root: guideList,
                threshold: 0.75
            });

            document.querySelectorAll('.guide-page').forEach(page => paginationObserver.observe(page));

            currentPage = 1;
            updateControls(1);
        }

        function preloadNextPageImages() {
            const nextPage = currentPage + 1;
            if (nextPage > totalPages || !pagesCache[nextPage - 1]) return;

            const nextGuides = pagesCache[nextPage - 1];

            nextGuides.forEach(guide => {
                const baseFilename = guide.file.split("$$")[0].replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "");
                const thumbnailUrl = `${config.paths.coversFolderName}/${encodeURIComponent(baseFilename)}.jpg`;

                if (!preloadQueue.has(thumbnailUrl)) {
                    const img = new Image();
                    img.src = thumbnailUrl;
                    preloadQueue.add(thumbnailUrl);
                }
            });
        }

        function generateGuides() {
            stopPlayAnimation();
            stopCarousel();
            const count = parseInt(generator.value);
            if (!count) return;

            const source = (generatorMode === 'visible') ?
                (generatedGuides || filteredGuides) :
                guides;

            if (source.length === 0) {
                alert(lang.alertNoItems);
                generator.value = config.pageSettings.defaultGeneratorCount;
                return;
            }

            let result;
            if (count >= source.length) {
                result = [...source].sort(() => 0.5 - Math.random());
            } else {
                result = [...source]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, count);
            }

            generatedGuides = result;
            slideshowSourceGuides = result;

            renderGuides(result);
            generator.value = config.pageSettings.defaultGeneratorCount;
        }

        function initializeNewButtons() {
            videoBtn.addEventListener('click', (e) => {
                const target = e.target.closest('.multi-button-main, .multi-button-child');
                if (!target) return;
                switch (target.id) {
                    case 'videoBtn-main':
                        const isVideoExpanded = videoBtn.classList.toggle('expanded');
                        saveToLocalStorage('video_expanded', isVideoExpanded);
                        break;
                    case 'videoBtn-play':
                        handleVideoStateChange();
                        break;
                    case 'videoBtn-shuffle':
                        toggleAutoShuffle();
                        break;
                    case 'videoBtn-prev':
                        changeBackgroundVideo(-1);
                        break;
                    case 'videoBtn-next':
                        changeBackgroundVideo(1);
                        break;

                const maxFontSize = 1.25; // w jednostkach rem

        function handleVideoStateChange() {
            switch (videoBgState) {
                case 'off':
                    videoBgState = 'playing';
                    updateBackgroundVideoVisibility(true);

                    break;
                case 'playing':
                    videoBgState = 'paused';
                    bgVideo.pause();
                    pausedTime = bgVideo.currentTime;
                    saveToLocalStorage('video_paused_time', pausedTime);
                    break;
                case 'paused':
                    videoBgState = 'off';
                    bgVideo.pause();
                    updateBackgroundVideoVisibility();
                    break;
            }
            saveToLocalStorage('video_bg_state', videoBgState);
            updateVideoBtnUI();

        function updateVideoBtnUI() {
            const buttons = [{
                play: document.getElementById('videoBtn-play')
            }, {
                play: document.getElementById('lightbox-video-toggle')
            }];
            buttons.forEach(btnSet => {
                if (!btnSet.play) return;

        function shuffleBackgroundVideo() {
            const {
                pageKey,
                bgVideoStartNum,
                bgVideoEndNum,
                defaultBgVideo
            } = config.pageSettings;
            const storageKey = `visudir_bg_video_${pageKey}`;
            const range = bgVideoEndNum - bgVideoStartNum;
            if (range < 1) return;
            const currentVideoNum = parseInt(localStorage.getItem(storageKey)) || defaultBgVideo;
            let newVideoNum;
            do {
                newVideoNum = Math.floor(Math.random() * (range + 1)) + bgVideoStartNum;
            } while (newVideoNum === currentVideoNum);
            localStorage.setItem(storageKey, newVideoNum);
            initializeBackgroundVideo(currentTheme);
        }

        function changeBackgroundVideo(direction) {
            if (videoBgState === 'off') return;

            if (autoShuffleInterval) {
                shuffleBackgroundVideo();
                return;
            }

            const {
                pageKey,
                bgVideoStartNum,
                bgVideoEndNum
            } = config.pageSettings;
            if (bgVideoEndNum - bgVideoStartNum < 1) return;

            const storageKey = `visudir_bg_video_${pageKey}`;
            let currentVideoNum = parseInt(localStorage.getItem(storageKey)) || bgVideoStartNum;
            currentVideoNum += direction;

            if (currentVideoNum > bgVideoEndNum) currentVideoNum = bgVideoStartNum;
            if (currentVideoNum < bgVideoStartNum) currentVideoNum = bgVideoEndNum;

            localStorage.setItem(storageKey, currentVideoNum);

            const wasPaused = videoBgState === 'paused';

            initializeBackgroundVideo(currentTheme);

            if (wasPaused) {
                bgVideo.addEventListener('canplay', function onCanPlay() {
                    bgVideo.currentTime = pausedTime;
                    bgVideo.pause();
                }, {
                    once: true
                });
            }

            updateVideoBtnUI();
        }

        function toggleAutoShuffle(forceStart = false) {
            if (!forceStart && videoBgState !== 'playing') return;
            if (autoShuffleInterval) {
                clearInterval(autoShuffleInterval);
                autoShuffleInterval = null;
                saveToLocalStorage('video_shuffle_enabled', false);
            } else {
                if (bgVideo.paused && videoBgState === 'playing') {
                    bgVideo.play();
                }
                shuffleBackgroundVideo();
                autoShuffleInterval = setInterval(shuffleBackgroundVideo, 20000);
                saveToLocalStorage('video_shuffle_enabled', true);
            }
            updateVideoBtnUI();
        }

        function resetVideoSettings() {
            const {
                pageKey,
                defaultBgVideo
            } = config.pageSettings;
            localStorage.setItem(`visudir_bg_video_${pageKey}`, defaultBgVideo);

            if (autoShuffleInterval) {
                clearInterval(autoShuffleInterval);
                autoShuffleInterval = null;
                saveToLocalStorage('video_shuffle_enabled', false);
            }

            if (videoBgState === 'paused') {
                videoBgState = 'playing';
                saveToLocalStorage('video_bg_state', videoBgState);
            }

            if (videoBgState !== 'off') {
                updateBackgroundVideoVisibility(true);
            }

            updateVideoBtnUI();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle("dark-mode");
            document.body.classList.toggle("dark-mode");
            const isDark = document.documentElement.classList.contains("dark-mode");
            localStorage.setItem('visudir_theme', isDark ? 'dark' : 'light');
            currentTheme = isDark ? 'dark' : 'light';

            const currentLogoData = config.logoRotator.logos[currentLogoIndex];
            if (config.pageSettings.showMiniLogo && config.logoRotator.enabled && currentLogoData) {
                headerLogo.src = currentTheme === 'dark' ? currentLogoData.srcDark : currentLogoData.srcLight;
            }
            document.querySelectorAll(".placeholder-cover").forEach((img) => {
                img.src = currentTheme === 'dark' ? ".base-system/gfx/no_cover_dark.png" : ".base-system/gfx/no_cover_light.png";
            });

            if (videoBgState !== 'off') {
                const wasPaused = videoBgState === 'paused';
                if (wasPaused) {
                    pausedTime = bgVideo.currentTime;
                }
                initializeBackgroundVideo(currentTheme);
                if (wasPaused) {
                    bgVideo.addEventListener('canplay', () => {
                        bgVideo.currentTime = pausedTime;

                    });

        function startSlideshowFrom(guideFilename) {
            const source = (generatorMode === 'visible' && generatedGuides) || filteredGuides;
            const startIndex = source.findIndex(g => g.file === guideFilename);

            if (startIndex === -1) {
                console.error("Nie znaleziono elementu w przefiltrowanej liście.");
                return;
            }
            startPlayAnimation(startIndex, true);
        }

        playCloseBtn.addEventListener('click', stopPlayAnimation);

        function toggleSlideshowPlayPause() {
            slideshowIsPlaying = !slideshowIsPlaying;
            saveToLocalStorage('slideshow_playing', slideshowIsPlaying);
            if (slideshowIsPlaying) {
                if (playGuidesQueue.length < 2) return;
                slideshowPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
                slideshowPlayBtn.classList.add('active-play');
                scheduleNext();
            } else {
                clearTimeout(playAnimationTimeout);
                slideshowPlayBtn.innerHTML = '<i class="fas fa-play"></i>';

        function toggleSlideshowShuffle() {

            document.getElementById('slideshow-shuffle').classList.toggle('active-play', slideshowIsRandom);
        }

        function startPlayAnimation(startIndex = 0, forcePause = false) {
            const source = slideshowSourceGuides.length > 0 ? slideshowSourceGuides : guides;
            if (source.length === 0) return;

            playGuidesQueue = [...source];
            playCurrentIndex = startIndex;

            document.body.classList.add("play-mode-active");
            document.body.classList.toggle("slideshow-no-animation", !slideshowAnimationsEnabled);

            setTimeout(() => {
                backdrop.classList.add("visible");
            }, 10);

            updateBackgroundVideoVisibility();

            const lastPlayState = JSON.parse(getFromLocalStorage('slideshow_playing'));
            slideshowIsPlaying = forcePause ? false : (lastPlayState !== null ? lastPlayState : true);

            if (slideshowIsPlaying) {
                slideshowPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
                slideshowPlayBtn.classList.add('active-play');
            } else {
                slideshowPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                slideshowPlayBtn.classList.remove('active-play');
            }

            lightboxLabelsBtn.classList.toggle('active-play', areLabelsVisible);
            lightboxFxBtn.classList.toggle('active', slideshowAnimationsEnabled);

            displayRandomGuide(playGuidesQueue[playCurrentIndex]);
        }

        function stopPlayAnimation() {
            if (playAnimationTimeout) clearTimeout(playAnimationTimeout);
            playAnimationTimeout = null;

            const container = playGuideContainer;
            const media = container.querySelector('img, video');
            if (media && slideshowAnimationsEnabled) {
                media.style.animation = 'zoomOutImage 0.4s ease-in forwards';
            }

            setTimeout(() => {
                document.body.classList.remove("play-mode-active");
                backdrop.classList.remove("visible", "preview-active");
                if (media) media.style.animation = '';
                playGuideContainer.innerHTML = "";
                if (playCaption) playCaption.innerHTML = "";
            }, slideshowAnimationsEnabled ? 400 : 0);

            slideshowPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
            slideshowPlayBtn.classList.remove('active-play');
            updateBackgroundVideoVisibility();
        }

        function scheduleNext(isNav = false) {
            if (playAnimationTimeout) clearTimeout(playAnimationTimeout);
            if (!isNav && !slideshowIsPlaying) return;
            let guide;
            if (playGuidesQueue.length < 2) {
                guide = playGuidesQueue[0];
            } else {
                if (slideshowIsRandom) {
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * playGuidesQueue.length);
                    } while (playGuidesQueue.length > 1 && newIndex === playCurrentIndex);
                    playCurrentIndex = newIndex;
                } else if (!isNav) {
                    playCurrentIndex = (playCurrentIndex + 1) % playGuidesQueue.length;
                }
                guide = playGuidesQueue[playCurrentIndex];
            }
            if (!guide) return;
            lastPlayedGuide = guide;
            displayRandomGuide(guide);
        }

        function preloadNextGuide(count = 3) {
            if (!slideshowIsPlaying || playGuidesQueue.length < 2) return;
            for (let i = 1; i <= count; i++) {
                let nextIndex;
                if (slideshowIsRandom) {
                    nextIndex = Math.floor(Math.random() * playGuidesQueue.length);
                } else {
                    nextIndex = (playCurrentIndex + i) % playGuidesQueue.length;
                }
                if (nextIndex === playCurrentIndex) continue;
                const nextGuide = playGuidesQueue[nextIndex];
                if (!nextGuide || ['mp4', 'avi'].includes(nextGuide.format)) continue;
                const baseFilename = nextGuide.file.split("$$")[0].replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "");
                const hdPath = config.paths.previewHdFolderName ? `${config.paths.previewHdFolderName}/${encodeURIComponent(baseFilename)}.jpg` : null;
                if (hdPath) {
                    (new Image()).src = hdPath;
                }
            }
        }

        function displayRandomGuide(guide) {
            playCaption.classList.remove('visible');
            const container = playGuideContainer;
            const existingContent = container.firstChild;
            const showNewGuide = () => {
                container.innerHTML = "";
                playCaption.classList.remove('visible');
                const fallbackCover = document.documentElement.classList.contains("dark-mode") ? ".base-system/gfx/no_cover_dark.png" : ".base-system/gfx/no_cover_light.png";
                const baseFilename = guide.file.split("$$")[0].replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "");
                const hdPath = config.paths.previewHdFolderName ? `${config.paths.previewHdFolderName}/${encodeURIComponent(baseFilename)}.jpg` : null;
                const sdPath = `${config.paths.coversFolderName}/${encodeURIComponent(baseFilename)}.jpg`;
                const directMediaPath = `${config.paths.dataFolderName}/${encodeURIComponent(guide.file)}`;
                const isVideo = ['mp4', 'avi'].includes(guide.format);
                const displayElement = document.createElement(isVideo ? 'video' : 'img');
                if (isVideo) {
                    displayElement.src = directMediaPath;
                    displayElement.controls = true;
                    displayElement.autoplay = true;
                    displayElement.onerror = () => {
                        displayElement.poster = sdPath;
                        displayElement.onerror = () => {
                            displayElement.poster = fallbackCover;
                            displayElement.onerror = null;
                        };
                    };
                } else {
                    displayElement.src = hdPath || sdPath;
                    displayElement.onerror = () => {
                        displayElement.src = sdPath;
                        displayElement.onerror = () => {
                            displayElement.src = fallbackCover;
                            displayElement.onerror = null;
                        };
                    };
                }
                const link = document.createElement('a');
                if (guide.format === 'link') {
                    const targetUrl = decodeUrlFromFilename(guide.file);
                    link.href = targetUrl;
                    if (!targetUrl.startsWith('.') && !targetUrl.startsWith('/')) {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    }
                } else {
                    const fileUrl = `${config.paths.dataFolderName}/${encodeURIComponent(guide.file)}`;
                    link.href = fileUrl;
                    if (guide.format === 'pdf' || isVideo) {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    } else {
                        link.download = guide.file;
                    }
                }
                link.appendChild(displayElement);
                container.appendChild(link);
                const currentIndexInQueue = playGuidesQueue.indexOf(guide);
                const counterText = playGuidesQueue.length > 1 ? `<b>${currentIndexInQueue + 1}</b><span class="caption-total"> / ${playGuidesQueue.length}</span>` : '';
                const descriptionText = guide.linkData.description || "";
                let titleText = guide.title.replace(/^\d{2}\s*/, "");
                playCaption.innerHTML = `<div class="caption-title-highlight">${counterText} ${titleText}</div><div class="caption-description">${descriptionText}</div>`;

                if (areLabelsVisible) {
                    const delay = slideshowAnimationsEnabled ? 1000 : 0;
                    setTimeout(() => playCaption.classList.add('visible'), delay);
                }
                if (slideshowIsPlaying && !isVideo) {
                    preloadNextGuide();
                    const slideDuration = 4000;
                    const transitionTime = slideshowAnimationsEnabled ? 500 : 0;
                    playAnimationTimeout = setTimeout(() => {
                        if (areLabelsVisible) {
                            playCaption.classList.remove('visible');
                            setTimeout(scheduleNext, transitionTime);
                        } else {
                            scheduleNext();
                        }
                    }, slideDuration - transitionTime);
                }
            };
            if (existingContent && slideshowAnimationsEnabled) {
                if (playAnimationTimeout) clearTimeout(playAnimationTimeout);
                const mediaElement = existingContent.querySelector ? existingContent.querySelector('img, video') : existingContent;
                if (mediaElement) {
                    mediaElement.style.animation = 'zoomOutImage 0.4s ease-in forwards';
                }
                setTimeout(showNewGuide, 400);
            } else {
                showNewGuide();
            }
        }

            document.getElementById('slideshow-prev').addEventListener('click', () => {
                if (!slideshowIsRandom) playCurrentIndex = (playCurrentIndex - 1 + playGuidesQueue.length) % playGuidesQueue.length;
                scheduleNext(true);

            document.getElementById('slideshow-first').addEventListener('click', () => {
                playCurrentIndex = 0;
                scheduleNext(true);
            });
            document.getElementById('slideshow-last').addEventListener('click', () => {
                playCurrentIndex = playGuidesQueue.length - 1;
                scheduleNext(true);

        }
        setupLightboxListeners();

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func.apply(this, args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        let lastWindowWidth = window.innerWidth;
        const debouncedRender = debounce(() => {
            if (window.innerWidth !== lastWindowWidth) {
                lastWindowWidth = window.innerWidth;
                renderGuides();
            }
        }, 250);
        window.addEventListener("resize", debouncedRender);

                if (carouselBtn) {
                    carouselBtn.innerHTML = '<i class="fas fa-play"></i>';
                    carouselBtn.title = lang.paginationCarouselStart;
                }
            }
        }

        function toggleCarousel() {
            const carouselBtn = document.getElementById('paginationCarouselBtn');
            if (carouselInterval) {
                stopCarousel();
            } else {
                if (totalPages <= 1) return;
                carouselBtn.innerHTML = '<i class="fas fa-pause"></i>';
                carouselBtn.title = lang.paginationCarouselStop;
                carouselInterval = setInterval(() => {
                    const nextPage = (currentPage % totalPages) + 1;
                    goToPage(nextPage);
                }, 5000);
            }
        }

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.toLowerCase().trim();
            if (query === 'reset' || query === 'clear') {
                const command = query;
                searchInput.value = '';
                intro();
                if (command === 'reset') {
                    setTimeout(hardReset, 1300);
                } else if (command === 'clear') {
                    clearScreen();
                }
                return;
            }
            applyFilters();
            renderGuides();
        });

        formatFilter.addEventListener("change", () => {
            const value = formatFilter.value;
            orientationFilterState = null;
            if (value.startsWith("search:")) {
                searchInput.value = value.substring(7);
            } else {
                saveToLocalStorage('format', value);
            }
            applyFilters();
            renderGuides();
        });

        function updateGeneratorModeBtn() {
            const btn = document.getElementById('generatorModeBtn');
            btn.classList.toggle('active', generatorMode === 'visible');
            btn.title = (generatorMode === 'all') ? lang.generatorModeAll : lang.generatorModeVisible;
        }

        sortSelector.addEventListener("change", (e) => {
            const sortValue = e.target.value;
            if (sortValue) {
                if (sortValue === 'shuffle') {
                    let source = (generatorMode === 'visible' && generatedGuides) || filteredGuides;
                    shuffleArray(source);
                    generatedGuides = source;
                    renderGuides(source);
                } else {
                    applySort(sortValue, guides);
                    saveToLocalStorage('sort', sortValue);
                    applyFilters();
                    renderGuides();
                }
            }
            e.target.value = "";
        });

        generator.addEventListener("change", generateGuides);
        document.getElementById('generatorModeBtn').addEventListener('click', () => {
            generatorMode = (generatorMode === 'all') ? 'visible' : 'all';
            saveToLocalStorage('generator_mode', generatorMode);
            updateGeneratorModeBtn();
        });
        updateGeneratorModeBtn();


        fileInput.addEventListener("change", function () {
            if (this.files[0]) {
                loadAndParseFile(this.files[0]);
                stopPlayAnimation();
            }
        });

        function initialize3dHoverEffect() {
            const guideList = document.getElementById('guideList');
            if (!guideList) return;

            let currentGuide = null;
            let animationFrameId = null;

            const onMouseMove = (e) => {
                if (!currentGuide) return;

                const rect = currentGuide.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const centerX = rect.width / 2;
                const centerY = rect.height / 2;

                const rotateX = ((centerY - y) / centerY) * -12;
                const rotateY = ((x - centerX) / centerX) * 12;

                const glowX = (x / rect.width) * 100;
                const glowY = (y / rect.height) * 100;

                cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(() => {
                    if (!currentGuide) return; // FIX for race condition
                    currentGuide.style.setProperty('--rotate-x', `${rotateX}deg`);
                    currentGuide.style.setProperty('--rotate-y', `${rotateY}deg`);
                    currentGuide.style.setProperty('--glow-x', `${glowX}%`);
                    currentGuide.style.setProperty('--glow-y', `${glowY}%`);
                });
            };

            guideList.addEventListener('mouseenter', (e) => {
                const guide = e.target.closest('.guide-list.view-image-only .guide');
                if (guide) {
                    guide.style.transition = 'none'; // Bezpośrednie sterowanie
                    currentGuide = guide;
                }
            }, true);

            guideList.addEventListener('mouseleave', (e) => {
                const guideTarget = e.target.closest('.guide-list.view-image-only .guide');
                if (currentGuide && (!guideTarget || guideTarget === currentGuide)) {
                    cancelAnimationFrame(animationFrameId);
                    currentGuide.style.transition = 'transform 0.4s ease-out'; // Przywrócenie transition
                    requestAnimationFrame(() => {
                        if (currentGuide) {
                            currentGuide.style.setProperty('--rotate-x', '0deg');
                            currentGuide.style.setProperty('--rotate-y', '0deg');
                        }
                    });
                    currentGuide = null;
                }
            }, true);


            guideList.addEventListener('mousemove', onMouseMove, true);
        }

        function applyMasonryLayout(pageNum = 1) {
            const guidePage = guideList.querySelector(`.guide-page[data-page-number="${pageNum}"]`);
            if (!guidePage) return;

            const items = Array.from(guidePage.children);
            if (items.length === 0) return;

            const gap = 20;
            const itemWidth = items[0].offsetWidth;
            if (itemWidth === 0) return;

            const containerWidth = guidePage.offsetWidth;
            const numColumns = Math.max(1, Math.floor((containerWidth + gap) / (itemWidth + gap)));

            guidePage.style.position = 'relative';
            guidePage.style.height = '';

            const columnHeights = Array(numColumns).fill(0);

            items.forEach(item => {
                const minHeight = Math.min(...columnHeights);
                const columnIndex = columnHeights.indexOf(minHeight);

                item.style.position = 'absolute';
                item.style.top = `${minHeight}px`;
                item.style.left = `${columnIndex * (itemWidth + gap)}px`;

                columnHeights[columnIndex] += item.offsetHeight + gap;
            });

            const maxHeight = Math.max(...columnHeights);
            guidePage.style.height = `${maxHeight}px`;
        }

        function updateWrapperHeightForPage(pageNum) {
            const wrapper = document.querySelector('.guide-list-wrapper');
            const pageElement = guideList.querySelector(`.guide-page[data-page-number="${pageNum}"]`);
            if (!wrapper || !pageElement) return;

            setTimeout(() => {
                let targetHeight = 0;
                if (currentViewMode === 'masonry') {
                    targetHeight = pageElement.offsetHeight;
                } else {
                    const items = pageElement.querySelectorAll('.guide');
                    if (items.length > 0) {
                        const gap = 20;
                        const itemHeight = items[0].offsetHeight;

                        if (itemHeight > 0) {
                            const itemWidth = items[0].offsetWidth;
                            const containerWidth = pageElement.offsetWidth;
                            const numColumns = Math.max(1, Math.floor((containerWidth + gap) / (itemWidth + gap)));
                            const numRows = Math.ceil(items.length / numColumns);
                            targetHeight = (numRows * itemHeight) + ((numRows - 1) * gap);
                        }
                    }
                }

                if (targetHeight > 0 && wrapper.offsetHeight !== targetHeight) {
                    wrapper.style.height = `${targetHeight}px`;
                }
            }, 150);
        }
    </script>
