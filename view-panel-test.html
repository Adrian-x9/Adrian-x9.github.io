<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <title>View Panel Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* --- General Body Styles --- */
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.5s ease, color 0.3s ease;
            background-color: #e1e1e1; /* Default light background */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        body.dark-mode {
            background-color: #121212; /* Dark background */
            color: #eee;
        }

        /* --- Main Panel Styles (from style.css) --- */
        .control-panel {
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 8px;
            box-sizing: border-box;
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            background-clip: padding-box;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        body:not(.dark-mode) .control-panel {
            background-color: #f0f0f0;
            box-shadow: 0 0 0 2px #cc0000, 0 5px 20px rgba(204, 0, 0, 0.3);
        }

        body.dark-mode .control-panel {
            background-color: #1a1a1a;
            box-shadow: 0 0 0 2px #e53935, 0 0 25px rgba(229, 57, 53, 0.5);
        }

        .deck-top-row {
            display: grid;
            grid-template-columns: minmax(300px, 40%) 20px 1fr;
            gap: 10px;
            width: 100%;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid;
            transition: grid-template-columns 0.4s ease-in-out;
        }

        body:not(.dark-mode) .deck-top-row {
            border-color: rgba(0, 0, 0, 0.15);
        }

        body.dark-mode .deck-top-row {
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .deck-bottom-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        /* --- Filter Section (Top-Left) --- */
        .filter-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
            overflow: hidden;
        }
        .filter-section > * {
           flex-shrink: 0;
        }

        .filter-section input,
        .filter-section select,
        .filter-section .dir-db-btn {
            height: 38px;
            padding-top: 0;
            padding-bottom: 0;
            border-radius: 8px;
            border: 1px solid;
        }

        .filter-section input[type="text"] {
            width: 160px;
        }

        .filter-section #sortSelector,
        .filter-section #generator {
            width: 120px;
        }

        body:not(.dark-mode) .filter-section input,
        body:not(.dark-mode) .filter-section select {
            background-color: #fff;
            border-color: #ccc;
            color: #333;
        }

        body.dark-mode .filter-section input,
        body.dark-mode .filter-section select {
            background-color: #2c2c2c;
            border-color: #555;
            color: #eee;
        }
        
        .dir-db-btn {
            padding: 10px;
            white-space: nowrap;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }
        
        .generator-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #generatorModeBtn {
            width: 38px;
        }

        #minimizeBtn {
            margin-left: auto;
        }

        /* --- Curtain Handle (Top-Center) --- */
        .curtain-handle {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            cursor: pointer;
            position: relative;
        }

        .curtain-handle::before {
            content: "";
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 80%;
        }

        body:not(.dark-mode) .curtain-handle::before {
            background-color: rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .curtain-handle::before {
            background-color: rgba(255, 255, 255, 0.25);
        }

        #curtain-toggle-btn {
            background: rgba(128, 128, 128, 0.2);
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            padding: 0;
            color: #fff;
            z-index: 1;
            cursor: pointer;
        }
        #curtain-toggle-btn i {
            margin: 0;
            font-size: 16px;
            line-height: 1;
            transition: transform 0.4s ease-in-out;
        }
        
        /* --- Status Section (Top-Right) --- */
        .status-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }
        #statusBarIntegrated {
            display: flex;
            align-items: center;
            gap: 0.8em;
        }
        #statusBarIntegrated span {
            font-size: 0.95em;
            font-weight: 500;
        }
        #statusBarIntegrated b {
            font-weight: 700;
        }
        .status-section-bottom {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-top: 5px;
            border-top: 1px solid rgba(204, 0, 0, 0.5);
            width: 100%;
            justify-content: flex-end;
        }
        .system-info {
            font-size: 0.9em;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-icons {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-icon-btn {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.7;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0;
        }
        .status-icon-btn:hover {
            opacity: 1;
            color: #cc0000;
        }
        body.dark-mode .status-icon-btn:hover {
            color: #e53935;
        }
        
        /* --- Curtain Animation --- */
        #currentTimeDisplay, #moonPhaseDisplay, #statusBarIntegrated, .system-info {
            transition: opacity 0.2s ease-in-out, height 0.2s, padding 0.2s, margin 0.2s;
        }
        .deck-top-row.filters-expanded {
            grid-template-columns: minmax(400px, 70%) 20px 1fr;
        }
        .deck-top-row.filters-expanded #curtain-toggle-btn i {
            transform: rotate(180deg);
        }
        .deck-top-row.filters-expanded #statusBarIntegrated,
        .deck-top-row.filters-expanded .system-info {
            opacity: 0;
            pointer-events: none;
            height: 0; margin: 0; padding: 0;
        }
        .deck-top-row.filters-expanded .status-section-bottom {
            border-top: none;
        }

        /* --- Bottom Row --- */
        .display-panel-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 6px;
            border-radius: 8px;
        }
        body.dark-mode .display-panel-group {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .deck-bottom-row .slider-group {
            flex-grow: 1;
        }

        .display-panel-group button {
            background-color: transparent;
            width: 42px;
            height: 42px;
            font-size: 1.1em;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
        }
        body:not(.dark-mode) .display-panel-group button {
            color: #333;
        }
        body.dark-mode .display-panel-group button {
            color: #eee;
        }
        .display-panel-group button:hover {
            border-color: #cc0000;
        }
        body.dark-mode .display-panel-group button:hover {
            border-color: #e53935;
        }
        .display-panel-group button.active,
        .display-panel button#viewContentBtn:hover,
        body.dark-mode .display-panel button#viewContentBtn:hover {
            background-color: #cc0000;
            color: white;
        }
        body.dark-mode .display-panel-group button.active {
            background-color: #e53935;
            color: black;
        }

        /* --- Sliders --- */
        .slider-control {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .slider-control i {
            font-size: 1.2em;
        }
        .slider-control input[type="range"] {
            -webkit-appearance: none; appearance: none;
            height: 6px; background: rgba(0, 0, 0, 0.1);
            outline: none; border-radius: 3px; cursor: pointer;
        }
        body.dark-mode .slider-control input[type="range"] {
            background: rgba(255, 255, 255, 0.2);
        }
        .slider-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: #cc0000; border: 2px solid #fff; cursor: pointer;
        }
        body.dark-mode .slider-control input[type="range"]::-webkit-slider-thumb {
            background: #e53935; border: 2px solid #000;
        }
        .slider-control span {
            font-weight: bold; min-width: 45px; text-align: right;
        }
        .title-red {
          color: #cc0000;
        }
        .version-suffix {
          color: #333;
        }
        body.dark-mode .title-red {
          color: #e53935;
        }
        body.dark-mode .version-suffix {
          color: #eee;
        }

    </style>
</head>

<body class=""> <div class="display-panel control-panel" id="displayPanel">
        <div class="deck-top-row">
            <div class="filter-section">
                <input type="file" id="fileInput" style="display: none;" />
                <input type="text" id="search" placeholder="Szukaj pozycji..." />
                <select id="formatFilter">
                    <option value="">FILTR</option>
                </select>
                <select id="sortSelector">
                    <option value="" disabled selected>SORTUJ</option>
                    <option value="shuffle">Wymieszaj</option>
                </select>
                <div class="generator-group">
                    <select id="generator">
                        <option value="" disabled selected>LOSUJ</option>
                        <option value="5">Pozycji: 5</option>
                    </select>
                    <button id="generatorModeBtn" class="dir-db-btn"><i class="fas fa-filter"></i></button>
                </div>
                <button id="minimizeBtn" class="dir-db-btn"><i class="fas fa-chevron-up"></i></button>
            </div>
            
            <div class="curtain-handle">
                <button id="curtain-toggle-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <div class="status-section">
                <div id="statusBarIntegrated">
                    <span id="guideCountDisplay" class="status-segment"><b>123</b> / 456</span>
                    <span id="currentTimeDisplay" class="status-segment"><b>14:25</b> 2025-09-28</span>
                    <span id="moonPhaseDisplay" class="status-segment">Księżyc 🌕︎</span>
                </div>
                <div class="status-section-bottom">
                    <div class="system-info">
                        System <span class="title-red">Visu</span><span class="version-suffix">Dir v1.12.3</span>
                    </div>
                    <div class="status-icons">
                        <a id="statusInfoBtn" class="status-icon-btn" title="Informacje"><i class="fas fa-info-circle"></i></a>
                        <a id="statusLangBtn" class="status-icon-btn" title="Zmień język"><i class="fas fa-globe"></i></a>
                        <button id="statusMuteBtn" class="status-icon-btn" title="Wycisz/Włącz wideo"><i class="fas fa-volume-mute"></i></button>
                        <button id="statusFullscreenBtn" class="status-icon-btn" title="Pełny ekran"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div class="deck-bottom-row">
            <div class="display-panel-group">
                <button id="viewContentBtn" title="Zmień tryb widoku"><i class="fas fa-file-image"></i></button>
                <button id="viewOrientationBtn" title="Pokaż wszystkie"><i class="fas fa-images"></i></button>
            </div>
            <div class="display-panel-group slider-group">
                <div class="slider-control">
                    <i class="fas fa-th-large" title="Wielkość miniaturek"></i>
                    <input type="range" id="sizeSlider" min="50" max="150" value="100" step="1">
                    <span id="sizeValue">100%</span>
                </div>
                <div class="slider-control">
                    <i class="fas fa-grip-lines" title="Liczba wierszy"></i>
                    <input type="range" id="rowsSlider" min="1" max="10" value="2" step="1">
                    <span id="rowsValue">2</span>
                </div>
            </div>
            <div class="display-panel-group">
                <button id="viewThemeBtn" title="Tryb Ciemny / Jasny"><i class="fas fa-moon"></i></button>
                <button id="viewPlayBtn" class="play-accent" title="Rozpocznij pokaz"><i class="fas fa-play"></i></button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Theme Toggle Functionality ---
            const themeBtn = document.getElementById('viewThemeBtn');
            const body = document.body;

            themeBtn.addEventListener('click', () => {
                // Toggle the .dark-mode class on the body
                body.classList.toggle('dark-mode');

                // Check if dark mode is active
                const isDark = body.classList.contains('dark-mode');
                const icon = themeBtn.querySelector('i');

                // Change the icon based on the current mode
                if (isDark) {
                    icon.className = 'fas fa-sun'; // Show sun icon in dark mode
                } else {
                    icon.className = 'fas fa-moon'; // Show moon icon in light mode
                }
            });
            
            // --- Curtain Toggle Functionality ---
            const curtainToggleBtn = document.getElementById("curtain-toggle-btn");
            const topRow = document.querySelector(".deck-top-row");

            if (curtainToggleBtn && topRow) {
                curtainToggleBtn.addEventListener("click", () => {
                    topRow.classList.toggle("filters-expanded");
                });
            }

            // --- Slider Value Display ---
            const sizeSlider = document.getElementById('sizeSlider');
            const sizeValue = document.getElementById('sizeValue');
            const rowsSlider = document.getElementById('rowsSlider');
            const rowsValue = document.getElementById('rowsValue');

            sizeSlider.addEventListener('input', () => {
                sizeValue.textContent = `${sizeSlider.value}%`;
            });

            rowsSlider.addEventListener('input', () => {
                rowsValue.textContent = rowsSlider.value;
            });
        });
    </script>

</body>
</html>
