    <style>
        /* Preloader Styles */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        html:not(.dark-mode) #preloader {
            background-color: #e1e1e1;
        }

        html:not(.dark-mode) .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #cc0000;
        }

        html.dark-mode #preloader {
            background-color: #121212;
        }

        html.dark-mode .spinner {
            border: 5px solid #333;
            border-top: 5px solid #e53935;
        }

        #preloader.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        html:not(.dark-mode) {
            background-color: #e1e1e1;
        }

        html.dark-mode {
            background-color: #121212;
        }

        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        body.video-ready {
            background-color: transparent !important;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
            transition: background-color 0.5s ease, color 0.3s ease;
            min-height: 100vh;
            box-sizing: border-box;
            overscroll-behavior-y: contain;
        }

        body.no-animation .guide.animate-in,
        body.no-animation .guide.flip-animate {
            animation: none !important;
            transform: none !important;
            opacity: 1 !important;
        }

        body.no-animation .guide-cover,
        body.no-animation .top-header,
        body.no-animation .footer {
            transition: none !important;
        }

        body.no-animation .multi-button,
        body.no-animation .multi-button-child,
        body.no-animation .dir-db-btn,
        body.no-animation .btn-text {
            transition: none !important;
        }

        /* +++ ZMIANA: Dodano .display-panel do listy elementów ukrywanych w trybie pokazu slajdów +++ */
        body.play-mode-active>.top-header,
        body.play-mode-active>.controls,
        body.play-mode-active>.display-panel,
        body.play-mode-active>.guide-list-wrapper,
        body.play-mode-active>.filter-controls,
        body.play-mode-active>.pagination,
        body.play-mode-active>.footer,
        body.play-mode-active>#fullscreenBtn {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.4s ease, visibility 0s 0.4s;
        }

        #fileInput {
            display: none;
        }

        a {
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: none;
        }

        .top-header a.dir-db-btn:hover {
            text-decoration: none;
        }

        .title-red {
            color: #cc0000;
        }

        .dark-mode .title-red {
            color: #e53935;
        }

        .dark-mode .version-suffix {
            color: #eee;
        }

        body:not(.dark-mode) .version-suffix {
            color: #333;
        }

        body:not(.dark-mode) .top-header .counter {

        }

        .dark-mode .top-header .counter {
            color: #aaa;
        }

        body:not(.dark-mode) {
            color: #333;
        }

        body:not(.dark-mode) a {
            color: #cc0000;
        }

        body:not(.dark-mode) button:hover {

        body:not(.dark-mode) .guide-cover {

        .top-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            text-align: center;
            opacity: 0;
            transform: translateY(-20px);
            max-height: 200px;
            overflow: hidden;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out, opacity 0.5s ease-out, margin 0.5s ease-out;
            padding-top: 5px;
        }

        .top-header.minimized-header {
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-bottom: 0 !important;
            opacity: 0;
        }

        .header-group {
            display: flex;
            gap: 10px;
        }

        .header-logo-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo-link {
            display: flex;
            align-items: center;
            perspective: 1000px;
        }

        .header-logo {
            max-height: 42px;
            width: auto;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .top-header .title {
            font-size: 1.6em;
        }

        /* NOWE STYLE DLA NAGŁÓWKA */
        body:not(.dark-mode) .top-header .title,
        body:not(.dark-mode) .top-header .counter {
            background: none;
            font-weight: 600;
            /* kompensacja optyczna dla stroke */
            color: black;
            -webkit-text-stroke: 0.5px gray;
            text-shadow: 0 0 1px rgba(128, 128, 128, 0.3);
            /* fallback dla Firefox */
        }

        body.dark-mode .top-header .title,
        body.dark-mode .top-header .counter {
            background: none;
            font-weight: 600;
            color: white;
            -webkit-text-stroke: 0.5px #ccc;
            text-shadow: 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .top-header .counter {
            font-size: 0.9em;
        }

        .top-header .counter b {
            font-weight: bold;
        }

        .top-header .title,
        .top-header .counter {

            border-radius: 8px;
        }

        .controls,
        .action-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .action-controls {
            margin-top: 20px;
        }

        .controls {
            opacity: 0;
            transform: translateY(-20px);
        }

        input,
        select,
        button,
        .dir-db-btn {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid;
            white-space: nowrap;
            height: 42px;
            box-sizing: border-box;
        }

        button,
        .dir-db-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        #search {
            width: 160px;
        }

        input::placeholder {
            color: #aaa;
        }

        .dark-mode input::placeholder {
            color: #666;
        }

        .dir-db-btn {
            padding: 10px 20px;
            transition: background 0.3s, transform 0.2s, box-shadow 0.2s, color 0.3s, width 0.4s ease, opacity 0.3s;
            font-size: 1em;
            cursor: pointer;
        }

        .dir-db-btn:hover {
            transform: translateY(-5px);
        }

        .dir-db-btn i {
            margin-right: 5px;
        }

        #minimizeBtn i,
        #langBtn i,
        #fullscreenBtn i {
            margin-right: 0;
        }

        #langBtn {
            padding: 10px 12px;
        }

        .multi-button {
            padding: 0;
            overflow: hidden;
        }

        .multi-button>span {
            padding: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .btn-text {
            transition: max-width 0.4s ease, opacity 0.3s ease;
            max-width: 100px;
            overflow: hidden;
            white-space: nowrap;
            display: inline-block;
        }

        .multi-button-main {
            flex-grow: 1;
            padding-right: 12px;
        }

        .multi-button-child {
            padding: 10px 12px;
            border-left: 1px solid rgba(0, 0, 0, 0.1);
        }

        .dark-mode .multi-button-child {
            border-left-color: rgba(255, 255, 255, 0.2);
        }

        .multi-button .multi-button-child {
            max-width: 0;
            padding: 0;
            opacity: 0;
            border-left: none;
            transition: max-width 0.4s ease, padding 0.4s ease, opacity 0.4s ease;
        }

        .multi-button.expanded .multi-button-child {
            max-width: 45px;
            padding: 10px 12px;
            opacity: 1;
            border-left: 1px solid rgba(0, 0, 0, 0.1);
        }

        .dark-mode .multi-button.expanded .multi-button-child {
            border-left-color: rgba(255, 255, 255, 0.2);
        }

        input,
        select {
            border-color: #808080;
        }

        body:not(.dark-mode) input,
        body:not(.dark-mode) select {
            background-color: #fff;
            color: #333;
        }

        .dark-mode input,
        .dark-mode select {
            background-color: #000;
            color: #eee;
            border-color: #808080;
        }

        .controls .dir-db-btn,
        .controls button,
        .action-controls .dir-db-btn,
        .action-controls button,
        .top-header .dir-db-btn {
            border-color: #a00000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2);
            font-weight: bold;
        }

        .controls .dir-db-btn:hover,
        .controls button:hover,
        .action-controls .dir-db-btn:hover,
        .action-controls button:hover,
        .top-header .dir-db-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        body:not(.dark-mode) .controls .dir-db-btn,
        body:not(.dark-mode) .controls button,
        body:not(.dark-mode) .action-controls .dir-db-btn,
        body:not(.dark-mode) .action-controls button,
        body:not(.dark-mode) .top-header .dir-db-btn {
            background: #fdfdfd;
            color: #cc0000;
        }

        body:not(.dark-mode) .controls .btn-text,
        body:not(.dark-mode) .action-controls .btn-text {
            color: #333;
        }

        .dark-mode .controls .dir-db-btn,
        .dark-mode .controls button,
        .dark-mode .action-controls .dir-db-btn,
        .dark-mode .action-controls button,
        .dark-mode .top-header .dir-db-btn {
            background: #000;
            color: #e53935;
        }

        .dark-mode .controls .btn-text,
        .dark-mode .action-controls .btn-text {
            color: #eee;
        }

        .action-controls .multi-button.expanded,
        #fxBtn.active {
            background: #fff;
        }

        .dark-mode .action-controls .multi-button.expanded,
        .dark-mode #fxBtn.active {
            background: #111;
        }

        .action-controls .multi-button:not(.expanded),
        #fxBtn:not(.active) {
            font-weight: normal;
        }

        #fxBtn.active .fa-cog,
        #lightbox-fxBtn.active .fa-cog {
            animation: spin 2s linear infinite;
        }

        #lightbox-fxBtn.active i {
            color: #e53935;
        }

        .dark-mode #lightbox-fxBtn.active i {
            color: #ff8a80;
        }

        .multi-button-child:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .dark-mode .multi-button-child:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .multi-button-child.active-play,
        #lightbox-labelsBtn.active-play {
            background-color: rgba(204, 0, 0, 0.2);
        }

        .dark-mode .multi-button-child.active-play,
        .dark-mode #lightbox-labelsBtn.active-play {
            background-color: rgba(229, 57, 53, 0.3);
        }

        body:not(.dark-mode) .multi-button-child.active-play i,
        body:not(.dark-mode) #lightbox-labelsBtn.active-play i {
            color: #cc0000;
            text-shadow: none;
        }

        body.dark-mode .multi-button-child.active-play i,
        body.dark-mode #lightbox-labelsBtn.active-play i {
            color: #ff8a80;
            text-shadow: none;
        }

        #lightbox-controls .multi-button-child.active-play i,
        #lightbox-bg-video-controls button.active-play i {
            color: #e53935;
            text-shadow: none !important;
        }

        .dark-mode #lightbox-controls .multi-button-child.active-play i,
        .dark-mode #lightbox-bg-video-controls button.active-play i {
            color: #ff8a80;
            text-shadow: none !important;
        }

        .guide-list-wrapper {
            width: 90%;
            max-width: 1920px;
            margin: 0 auto;
            overflow: hidden;
        }

        .guide-list {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .guide-list::-webkit-scrollbar {
            display: none;
        }

        .guide-list-wrapper+.pagination {
            margin-top: 20px;
        }

        .guide-page {
            box-sizing: border-box;
            flex: 0 0 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: grid;
            grid-template-rows: repeat(var(--grid-rows, 4), 1fr);
            grid-template-columns: repeat(auto-fill, minmax(var(--box-width, 257px), 1fr));
            justify-content: center;
            gap: 20px;
            padding: 2px;
        }

        .guide-list.random-draw {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            overflow-x: hidden;
        }

        .guide-cover {
            max-width: 100%;
            height: auto;
            max-height: 300px;
            margin: 10px auto 0;
            display: block;
            border-radius: 10px;
            transition: opacity 0.5s, max-height 0.5s, margin 0.5s, padding 0.5s, border-width 0.5s, transform 0.5s ease-in-out;
        }

        .guide .guide-cover {
            opacity: 1;
            transform: scale(1);
        }

        .guide-page:not(.only-covers) .guide.animate-in .guide-cover {
            transition: none;
            opacity: 0;
            transform: scale(0.7);
            animation: fadeInCover 0.5s 0.1s ease-out forwards;
        }

        @keyframes fadeInCover {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .guide-list.hide-covers .guide-cover {
            opacity: 0;
            max-height: 0;
            margin-top: 0;
            margin-bottom: 0;
            padding-top: 0;
            padding-bottom: 0;
            border-width: 0;
            transform: scale(0.7);
            overflow: hidden;
        }

        .guide-title,
        .guide-info,
        .guide-content-bottom>a:not(.cover-link) {
            transition: opacity 0.5s, max-height 0.5s, margin 0.5s, padding 0.5s;
            overflow: hidden;
        }

        .guide-list.only-covers .guide-title,
        .guide-list.only-covers .guide-info,
        .guide-list.only-covers .guide-content-bottom>a:not(.cover-link) {
            opacity: 0;
            max-height: 0;
            margin: 0;
            padding: 0;
            pointer-events: none;
        }

        .guide-list.only-covers .guide {
            padding: 10px;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .guide-list.only-covers .guide-cover {
            margin: 0;
            border: none !important;
            opacity: 1;
            transform: scale(1);
        }

        .guide {
            padding: 0 20px 10px;
            border-radius: 10px;
            transition: background 0.3s, transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            /* Potrzebne dla nowego efektu hover */
            overflow: hidden;
            /* Potrzebne dla nowego efektu hover */
        }

        /* --- USUNIĘTO STARY EFEKT HOVER ---
        .guide:hover {
            transform: translateY(-5px);
        }
        */

        .guide-content-bottom {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .guide-info-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .guide a {
            margin-top: 10px;
            display: inline-block;
        }

        .guide a.cover-link {
            margin-top: 0;
            display: block;
        }

        .guide-info {
            font-size: 0.9em;
        }

        .guide-title {
            margin-top: 7px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            overflow-wrap: break-word;
        }

        .pagination {
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out, max-height 0.5s, margin 0.5s, padding 0.5s;
            max-height: 0;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .pagination.visible {
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .pagination button {
            cursor: pointer;
            border-radius: 10px;
            border: 1px solid #a00000;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2);
            font-weight: bold;
            height: 42px;
            box-sizing: border-box;
            padding: 10px;
        }

        .pagination button:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        body:not(.dark-mode) .pagination button {
            background: #fdfdfd;
            color: #cc0000;
        }

        .dark-mode .pagination button {
            background: #000;
            color: #e53935;
            border-color: #a00000;
        }

        .pagination .pagination-info {
            padding: 10px;
            font-weight: bold;
        }

        body:not(.dark-mode) .pagination .pagination-info {
            color: #555;
        }

        .dark-mode .pagination .pagination-info {
            color: #aaa;
        }

        .pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .guide.animate-in {
            animation: fadeInSlideIn 0.5s ease-out forwards;
        }

        @keyframes fadeInSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            padding: 20px;
            padding-top: 10px;
            font-size: 0.9em;
            opacity: 1;
            transform: translateY(0);
            max-height: 200px;
            overflow: hidden;
            transition: max-height 0.5s ease-out, padding 0.5s ease-out, opacity 0.5s ease-out, margin 0.5s ease-out, transform 0.5s ease-out;
        }

        .footer.minimized-footer {
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            opacity: 0;
        }

        .footer.hidden-animated {
            opacity: 0;
            transform: translateY(20px);
        }

        .nobr {
            white-space: nowrap;
        }

        .privacy-notice {
            margin-top: 10px;
            font-size: 0.9em;
        }

        .footer .footer-special-text {
            font-weight: normal;
        }

        body.play-mode-active {
            overflow: hidden;
        }

        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .backdrop.visible {
            display: flex;
            opacity: 1;
            visibility: visible;
        }

        /* --- EASTER EGG: CRT Effect Styles --- */
        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10001;
            background: #111;
            opacity: 0;
            pointer-events: none;
            overflow: hidden;
        }

        html.dark-mode #crt-overlay {
            background: #eee;
        }

        #crt-overlay.active {
            opacity: 1;
            animation: crt-flicker 0.1s infinite, crt-collapse 1s 0.5s ease-out forwards;
        }

        #crt-overlay::before {
            content: ' ';
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 3px 100%;
            animation: crt-scanline 2s linear infinite;
        }

        html.dark-mode #crt-overlay::before {
            background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(200, 200, 200, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            background-size: 100% 4px, 3px 100%;
        }


        @keyframes crt-flicker {
            0% {
                opacity: 0.95;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.98;
            }
        }

        @keyframes crt-scanline {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(100%);
            }
        }

        @keyframes crt-collapse {
            0% {
                transform: scale(1, 1);
            }

            30% {
                transform: scale(1.05, 1);
            }

            80% {
                transform: scale(0.001, 1);
                opacity: 1;
            }

            100% {
                transform: scale(0.001, 0);
                opacity: 0;
            }
        }

        function getFileExtension(filename) {
            return filename.slice(((filename.lastIndexOf(".") - 1) >>> 0) + 2).toLowerCase();
        }

        function normalizeUrl(url) {
            const trimmedUrl = url.trim();
            if (trimmedUrl.startsWith('http://') || trimmedUrl.startsWith('https://') || trimmedUrl.startsWith('./') || trimmedUrl.startsWith('../') || trimmedUrl.startsWith('/')) {
                return trimmedUrl;
            }
            return `https://${trimmedUrl}`;
        }

        function decodeUrlFromFilename(filename) {
            let urlPart = filename.split('$$')[0];
            urlPart = urlPart.replace(/\.link$/i, '');
            urlPart = urlPart.replace(/#/g, '/');
            urlPart = urlPart.replace(/&&/g, '?');
            return normalizeUrl(urlPart);
        }

        function parseGuideTitle(filename) {
            const baseName = filename.replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, '').trim();
            const parts = baseName.split('$$');
            if (getFileExtension(filename) === 'link' && parts.length > 1) {
                return {
                    title: decodeURIComponent(parts[1] || ''),
                    offlineDesc: decodeURIComponent(parts[2] || null)
                };
            }
            const title = decodeURIComponent(parts[0].replace(/_/g, ' ').replace(/-/g, ' ')).replace(/\s*-\s*Poradnik(?:_do_gry)?\s*(?:GRY-OnLine|Gry-OnLine)?\s*/i, '').trim();
            return {
                title: title,
                offlineDesc: null
            };
        }

        function createDateFromStrings(dateStr, timeStr) {
            const [day, month, year] = dateStr.split('.').map(Number);
            const [hours, minutes] = timeStr.split(':').map(Number);
            return new Date(year, month - 1, day, hours, minutes);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function applySort(sortType, array) {
            currentSort = sortType;
            switch (sortType) {
                case "shuffle":
                    shuffleArray(array);
                    break;
                case "nameAsc":
                    array.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case "nameDesc":
                    array.sort((a, b) => b.title.localeCompare(a.title));
                    break;
                case "dateAsc":
                    array.sort((a, b) => a.timestamp - b.timestamp);
                    break;
                case "dateDesc":
                    array.sort((a, b) => b.timestamp - a.timestamp);
                    break;
                case "sizeAsc":
                    array.sort((a, b) => parseFloat(a.sizeMB) - parseFloat(b.sizeMB));
                    break;
                case "sizeDesc":
                    array.sort((a, b) => parseFloat(b.sizeMB) - parseFloat(a.sizeMB));
                    break;
            }
        }

        function getGuideOrientation(guide) {
            return new Promise((resolve) => {
                const f = guide.file.replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "").split("$$")[0];
                const coverUrl = `${config.paths.coversFolderName}/${encodeURIComponent(f)}.jpg`;
                if (guideDimensionsCache[coverUrl]) {
                    guide.orientation = guideDimensionsCache[coverUrl];
                    resolve();
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    guide.orientation = (img.naturalHeight > img.naturalWidth) ? 'vertical' : 'horizontal';
                    guideDimensionsCache[coverUrl] = guide.orientation;
                    resolve();
                };
                img.onerror = () => {
                    guide.orientation = 'unknown';
                    guideDimensionsCache[coverUrl] = 'unknown';
                    resolve();
                };
                img.src = coverUrl;
            });
        }

        async function processData(text) {
            const lines = text.split(/\r?\n/);
            guides = [];
            for (const line of lines) {
                const match = line.match(/^(\d{2}\.\d{2}\.\d{4})\s+(\d{2}:\d{2})\s+((?:<DIR>)|\d+)\s+(.+)$/i);
                if (match) {
                    const date = match[1];
                    const time = match[2];
                    const sizeOrDir = match[3];
                    const filename = match[4];
                    const format = getFileExtension(filename);
                    let sizeBytes = 0;
                    if (sizeOrDir !== '<DIR>') {
                        sizeBytes = parseInt(sizeOrDir);
                    }
                    if (sizeBytes === 0 && format !== 'link') continue;
                    const sizeMB = (sizeBytes / (1024 * 1024)).toFixed(2);
                    const {
                        title,
                        offlineDesc
                    } = parseGuideTitle(filename);
                    let linkData = {
                        description: offlineDesc
                    };
                    if (format === 'link' && location.protocol !== 'file:') {
                        try {
                            const response = await fetch(`${config.paths.dataFolderName}/${filename}`);
                            if (response.ok) {
                                linkData.description = await response.text();
                            } else if (!offlineDesc) {
                                linkData.description = 'Błąd wczytywania opisu.';
                            }
                        } catch (e) {
                            if (!offlineDesc) linkData.description = 'Błąd wczytywania opisu.';
                        }
                    }
                    guides.push({
                        title,
                        format,
                        file: filename,
                        sizeMB,
                        date,
                        time,
                        timestamp: createDateFromStrings(date, time).getTime(),
                        linkData,
                        orientation: 'pending'
                    });
                }
            }
            const orientationPromises = guides
                .filter(guide => ['jpg', 'png', 'link', 'mp4', 'avi'].includes(guide.format))
                .map(guide => getGuideOrientation(guide));
            await Promise.all(orientationPromises);
        }

        function checkFileAndOpen(targetUrl, fallbackUrl, isLink = false) {
            if (targetUrl.startsWith('http')) {
                window.open(targetUrl, '_blank');
                return;
            }

            const [filePath] = targetUrl.split('?');
            const isLocalHtml = filePath.endsWith('.html');

            if (isLink && isLocalHtml) {
                if (window.location.protocol === 'file:') {
                    window.location.href = targetUrl;
                    return;
                }
                fetch(filePath, {
                    method: 'HEAD'
                })
                    .then(response => {
                        window.location.href = response.ok ? targetUrl : fallbackUrl;
                    })
                    .catch(() => {
                        window.location.href = fallbackUrl;
                    });
                return;
            }

            const http = new XMLHttpRequest();
            http.open('HEAD', filePath, true);
            http.timeout = 2000;
            http.onload = function () {
                if (this.status === 200 || this.status === 0) {
                    window.open(targetUrl, '_blank');
                } else {
                    window.location.href = fallbackUrl;
                }
            };
            http.onerror = http.ontimeout = function () {
                window.location.href = fallbackUrl;
            };
            http.send();
        }


        function createGuideHtml(guide) {
            const f = guide.file.replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "").split("$$")[0],
                u = `${config.paths.dataFolderName}/${encodeURIComponent(guide.file)}`,
                c = `${config.paths.coversFolderName}/${encodeURIComponent(f)}.jpg`;
            let h = "",
                i = "",
                a = "",
                w = "";
            let d = guide.title;
            if (guide.format === "link" && /^\d{2}\s*/.test(d))
                d = d.replace(/^\d{2}\s*/, "");

            const mediaTypes = ["jpg", "png", "mp4", "avi"];

            if (guide.format === "link") {
                const t = decodeUrlFromFilename(guide.file);
                const clickAction = `checkFileAndOpen('${t.replace(/'/g, "\\'")}', '${config.paths.urlFallback}', true); return false;`;
                h = `<div class="guide-title"><a href="${t}" onclick="${clickAction}">${d}</a></div>`;
                i = `<div class="guide-info">${guide.linkData.description || ""}</div>`;
                a = `<a href="${t}" onclick="${clickAction}"><i class="fas fa-external-link-alt"></i> Otwórz</a>`;
                w = `<a href="${t}" onclick="${clickAction}" class="cover-link">`;
            } else if (mediaTypes.includes(guide.format)) {
                const clickAction = `startSlideshowFrom('${guide.file.replace(/'/g, "\\'")}'); return false;`;
                h = `<div class="guide-title"><a href="#" onclick="${clickAction}">${d}</a></div>`;
                i = `<div class="guide-info"><i class="fas fa-calendar-alt"></i> ${guide.date} ${guide.time}<br><i class="fas fa-file-alt"></i> Format: ${guide.format.toUpperCase()}<br><i class="fas fa-database"></i> Rozmiar: ${guide.sizeMB} MB</div>`;
                a = `<a href="#" onclick="${clickAction}"><i class="fas fa-eye"></i> Otwórz</a>`;
                w = `<a href="#" onclick="${clickAction}" class="cover-link">`;
            } else {
                h = `<div class="guide-title">${d}</div>`;
                i = `<div class="guide-info"><i class="fas fa-calendar-alt"></i> ${guide.date} ${guide.time}<br><i class="fas fa-file-alt"></i> Format: ${guide.format.toUpperCase()}<br><i class="fas fa-database"></i> Rozmiar: ${guide.sizeMB} MB</div>`;
                const clickAction = `checkFileAndOpen('${u.replace(/'/g, "\\'")}', '${config.paths.urlFallback}'); return false;`;
                if (guide.format === "pdf") {
                    a = `<a href="${u}" onclick="${clickAction}"><i class="fas fa-file-pdf"></i> Otwórz</a>`;
                    w = `<a href="#" onclick="${clickAction}" class="cover-link">`;
                } else {
                    a = `<a href="${u}" download><i class="fas fa-download"></i> Pobierz</a>`;
                    w = `<a href="${u}" download class="cover-link">`;
                }
            }
            const k = document.documentElement.classList.contains("dark-mode") ? ".base-system/gfx/no_cover_dark.png" : ".base-system/gfx/no_cover_light.png";
            return `${h}<div class="guide-content-bottom"><div class="guide-info-container">${i}</div>${w}<img src="${c}" alt="Okładka: ${d}" class="guide-cover" onerror="this.onerror=null;this.src='${k}';this.classList.add('placeholder-cover');this.style.opacity=1;this.style.transform='scale(1)';"></a>${a}</div>`;
        }

        function renderGuides() {
            guideList.classList.remove('random-draw');
            const animationsOn = !document.body.classList.contains('no-animation');

            applyFilters();
            guideList.innerHTML = "";
            if (lazyLoadObserver) lazyLoadObserver.disconnect();

            // +++ ZMIANA: Obliczanie szerokości kafelka na podstawie suwaka +++
            const sizePercent = document.getElementById('sizeSlider').value;
            const newWidth = config.pageSettings.baseBoxWidth * (sizePercent / 100);
            
            guideList.style.setProperty('--grid-rows', selectedRowCount);
            guideList.style.setProperty('--box-width', `${newWidth}px`);

            const guideGap = 20;
            const itemWidth = newWidth;
            const columns = Math.floor((guideList.clientWidth + guideGap) / (itemWidth + guideGap)) || 1;
            const itemsPerPage = columns * selectedRowCount;

            pagesCache = [];
            if (itemsPerPage > 0) {
                for (let i = 0; i < filteredGuides.length; i += itemsPerPage) {
                    pagesCache.push(filteredGuides.slice(i, i + itemsPerPage));
                }
            } else if (filteredGuides.length > 0) {
                pagesCache.push(filteredGuides);
            }
            totalPages = pagesCache.length || 1;

            pagesCache.forEach((pageItems, pageIndex) => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'guide-page';
                pageDiv.dataset.pageNumber = pageIndex + 1;

                if (pageIndex === 0) {
                    pageItems.forEach((guide, index) => {
                        const div = document.createElement("div");
                        div.className = "guide";
                        if (animationsOn && isInitialLoad) {
                            div.classList.add("animate-in");
                            div.style.animationDelay = `${index * 0.04}s`;
                        }
                        div.innerHTML = createGuideHtml(guide);
                        pageDiv.appendChild(div);
                    });
                }
                guideList.appendChild(pageDiv);
            });

            setupLazyLoading(pagesCache);
            renderPagination();
            document.getElementById("guideCountDisplay").innerHTML = `<b>${filteredGuides.length}</b> / ${guides.length} pozycji`;

            if (isInitialLoad) {
                isInitialLoad = false;
                preloadNextPageImages();
            }
        }

        function setupLazyLoading(pages) {
            if (lazyLoadObserver) lazyLoadObserver.disconnect();

            lazyLoadObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageDiv = entry.target;
                        const pageNum = parseInt(pageDiv.dataset.pageNumber, 10);

                        if (pageDiv.childElementCount === 0 && pageNum > 1) {
                            const pageItems = pages[pageNum - 1];
                            if (pageItems) {
                                requestAnimationFrame(() => {
                                    pageItems.forEach((guide, index) => {
                                        const div = document.createElement("div");
                                        div.className = "guide";
                                        div.innerHTML = createGuideHtml(guide);
                                        pageDiv.appendChild(div);
                                    });
                                });
                            }
                        }
                        observer.unobserve(pageDiv);
                    }
                });
            }, {
                root: guideList,
                rootMargin: '0px 300px 0px 300px'
            });

            document.querySelectorAll('.guide-page').forEach(page => {
                lazyLoadObserver.observe(page);
            });
        }

        function renderPagination() {
            const paginationContainer = document.getElementById('pagination');

            paginationContainer.innerHTML = `
                <div class="pagination-controls">
                    <button id="firstPageBtn" title="Pierwsza strona"><i class="fas fa-fast-backward"></i></button>
                    <button id="prevPageBtn" title="Poprzednia strona"><i class="fas fa-chevron-left"></i></button>
                    <div class="pagination-center">
                        <div class="page-info">
                            <input type="number" id="pageInput" min="1" value="1" class="page-input">
                            <span id="pageInfoText" class="page-info-text">/ 1</span>
                        </div>
                        <input type="range" id="pageSlider" min="1" max="1" value="1" class="page-slider">
                    </div>
                    <button id="nextPageBtn" title="Następna strona"><i class="fas fa-chevron-right"></i></button>
                    <button id="lastPageBtn" title="Ostatnia strona"><i class="fas fa-fast-forward"></i></button>
                </div>
            `;

            const controls = paginationContainer.querySelector('.pagination-controls');

            if (totalPages <= 1) {
                paginationContainer.classList.remove('visible');
                controls.style.display = 'none';
                return;
            }

            paginationContainer.classList.add('visible');
            controls.style.display = 'flex';

            const firstPageBtn = document.getElementById('firstPageBtn');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const lastPageBtn = document.getElementById('lastPageBtn');
            const pageInput = document.getElementById('pageInput');
            const pageSlider = document.getElementById('pageSlider');
            const pageInfoText = document.getElementById('pageInfoText');

            const goToPage = (pageNum) => {
                pageNum = Math.max(1, Math.min(totalPages, pageNum));
                const targetScrollLeft = guideList.clientWidth * (pageNum - 1);
                guideList.scrollTo({ left: targetScrollLeft, behavior: 'smooth' });
            };

            const updateControls = (pageNum) => {
                pageInfoText.textContent = `/ ${totalPages}`;
                pageInput.value = pageNum;
                pageInput.max = totalPages;
                pageSlider.value = pageNum;
                pageSlider.max = totalPages;

                firstPageBtn.disabled = prevPageBtn.disabled = (pageNum <= 1);
                lastPageBtn.disabled = nextPageBtn.disabled = (pageNum >= totalPages);

                preloadNextPageImages();
            };

            firstPageBtn.onclick = () => goToPage(1);
            prevPageBtn.onclick = () => goToPage(currentPage - 1);
            nextPageBtn.onclick = () => goToPage(currentPage + 1);
            lastPageBtn.onclick = () => goToPage(totalPages);

            pageSlider.addEventListener('input', () => {
                pageInput.value = pageSlider.value;
            });

            pageSlider.addEventListener('change', () => {
                goToPage(parseInt(pageSlider.value, 10));
            });

            pageInput.addEventListener('change', () => {
                goToPage(parseInt(pageInput.value, 10));
            });
            pageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    goToPage(parseInt(pageInput.value, 10));
                    pageInput.blur();
                }
            });

            const paginationObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const pageNum = parseInt(entry.target.dataset.pageNumber, 10);
                        currentPage = pageNum;
                        updateControls(pageNum);
                    }
                });
            }, { root: guideList, threshold: 0.75 });

            document.querySelectorAll('.guide-page').forEach(page => paginationObserver.observe(page));

            currentPage = 1;
            updateControls(1);
        }

        function preloadNextPageImages() {
            const nextPage = currentPage + 1;
            if (nextPage > totalPages || !pagesCache[nextPage - 1]) return;

            const nextGuides = pagesCache[nextPage - 1];

            nextGuides.forEach(guide => {
                const baseFilename = guide.file.split("$$")[0].replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "");
                const thumbnailUrl = `${config.paths.coversFolderName}/${encodeURIComponent(baseFilename)}.jpg`;

                if (!preloadQueue.has(thumbnailUrl)) {
                    const img = new Image();
                    img.src = thumbnailUrl;
                    preloadQueue.add(thumbnailUrl);
                }
            });
        }

        function handleVideoStateChange() {
            switch (videoBgState) {
                case 'off':
                    videoBgState = 'playing';
                    updateBackgroundVideoVisibility(true);
                    if (bgVideo.paused) bgVideo.play();
                    break;
                case 'playing':
                    videoBgState = 'paused';
                    bgVideo.pause();
                    pausedTime = bgVideo.currentTime;
                    saveToLocalStorage('video_paused_time', pausedTime);
                    break;
                case 'paused':
                    videoBgState = 'off';
                    bgVideo.pause();
                    updateBackgroundVideoVisibility();
                    break;
            }
            saveToLocalStorage('video_bg_state', videoBgState);
            updateVideoBtnUI();
        }

        function updateVideoBtnUI() {
            const buttons = [{
                play: document.getElementById('videoBtn-play')
            }, {
                play: document.getElementById('lightbox-video-toggle')
            }];
            buttons.forEach(btnSet => {
                if (!btnSet.play) return;
                switch (videoBgState) {
                    case 'playing':
                        btnSet.play.innerHTML = '<i class="fas fa-pause"></i>';
                        btnSet.play.title = 'Pauza';

                        btnSet.play.title = 'Wyłącz wideo';

                lightboxShuffleBtn.classList.toggle('active-play', autoShuffleInterval !== null);
            }
        }

        function shuffleBackgroundVideo() {
            const {
                pageKey,
                bgVideoStartNum,
                bgVideoEndNum,
                defaultBgVideo
            } = config.pageSettings;
            const storageKey = `visudir_bg_video_${pageKey}`;
            const range = bgVideoEndNum - bgVideoStartNum;
            if (range < 1) return;
            const currentVideoNum = parseInt(localStorage.getItem(storageKey)) || defaultBgVideo;
            let newVideoNum;
            do {
                newVideoNum = Math.floor(Math.random() * (range + 1)) + bgVideoStartNum;
            } while (newVideoNum === currentVideoNum);
            localStorage.setItem(storageKey, newVideoNum);
            initializeBackgroundVideo(currentTheme);
        }

        function changeBackgroundVideo(direction) {
            if (videoBgState === 'off') return;

            if (autoShuffleInterval) {
                shuffleBackgroundVideo();
                return;
            }

            const {
                pageKey,
                bgVideoStartNum,
                bgVideoEndNum
            } = config.pageSettings;
            if (bgVideoEndNum - bgVideoStartNum < 1) return;

            const storageKey = `visudir_bg_video_${pageKey}`;
            let currentVideoNum = parseInt(localStorage.getItem(storageKey)) || bgVideoStartNum;
            currentVideoNum += direction;

            if (currentVideoNum > bgVideoEndNum) currentVideoNum = bgVideoStartNum;
            if (currentVideoNum < bgVideoStartNum) currentVideoNum = bgVideoEndNum;

            localStorage.setItem(storageKey, currentVideoNum);

            const wasPaused = videoBgState === 'paused';

            initializeBackgroundVideo(currentTheme);

            if (wasPaused) {
                bgVideo.addEventListener('canplay', function onCanPlay() {
                    bgVideo.currentTime = pausedTime;
                    bgVideo.pause();
                }, {
                    once: true
                });
            }

            updateVideoBtnUI();
        }

        function toggleAutoShuffle() {
            if (videoBgState !== 'playing') return;
            if (autoShuffleInterval) {
                clearInterval(autoShuffleInterval);
                autoShuffleInterval = null;
            } else {
                if (bgVideo.paused) {
                    bgVideo.play();
                }
                shuffleBackgroundVideo();
                autoShuffleInterval = setInterval(shuffleBackgroundVideo, 20000);
            }
            updateVideoBtnUI();
        }

        function toggleBackgroundVideoPlayback() {
            if (videoBgState === 'off') return;
            if (bgVideo.paused) {
                bgVideo.play();
            } else {
                bgVideo.pause();
            }
            updateVideoBtnUI();
        }

        function resetVideoSettings() {
            const {
                pageKey,
                defaultBgVideo
            } = config.pageSettings;
            localStorage.setItem(`visudir_bg_video_${pageKey}`, defaultBgVideo);

            if (autoShuffleInterval) {
                clearInterval(autoShuffleInterval);
                autoShuffleInterval = null;
            }

            if (videoBgState === 'paused') {
                videoBgState = 'playing';
            }

            if (videoBgState !== 'off') {
                updateBackgroundVideoVisibility(true);
            }

            updateVideoBtnUI();
        }

                const currentLogoData = config.logoRotator.logos[currentLogoIndex];

                    });

        function startSlideshowFrom(guideFilename) {
            const sourceGuides = filteredGuides;
            const startIndex = sourceGuides.findIndex(g => g.file === guideFilename);

            if (startIndex === -1) {
                console.error("Nie znaleziono elementu w przefiltrowanej liście.");

        playButton.addEventListener('click', () => startPlayAnimation());
        playCloseBtn.addEventListener('click', stopPlayAnimation);

        function togglePlayAnimation() {
            if (playAnimationTimeout || slideshowIsPlaying) stopPlayAnimation();
            else startPlayAnimation();
        }

        function toggleSlideshowPlayPause() {
            if (slideshowIsPlaying) {
                slideshowIsPlaying = false;
                clearTimeout(playAnimationTimeout);
                slideshowPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                slideshowPlayBtn.classList.remove('active-play');

            slideshowIsRandom = !slideshowIsRandom;
            document.getElementById('slideshow-shuffle').classList.toggle('active-play', slideshowIsRandom);
        }

        function startPlayAnimation(startIndex = 0) {
            const source = slideshowSourceGuides.length > 0 ? slideshowSourceGuides : guides;
            if (source.length === 0) return alert("Brak pozycji do wyświetlenia!");

            playGuidesQueue = [...source];
            playCurrentIndex = startIndex;

            document.body.classList.add("play-mode-active");
            playButton.querySelector('.btn-text').textContent = ' Stop';
            if (!document.body.classList.contains('no-animation')) {
                setTimeout(() => {
                    backdrop.classList.add("visible");
                }, 10);
            } else {
                backdrop.classList.add("visible");
            }
            updateBackgroundVideoVisibility();
            slideshowIsPlaying = true;
            slideshowPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
            slideshowPlayBtn.classList.add('active-play');
            lightboxLabelsBtn.classList.toggle('active-play', areLabelsVisible);

            displayRandomGuide(playGuidesQueue[playCurrentIndex]);
        }

        function stopPlayAnimation() {
            if (playAnimationTimeout) clearTimeout(playAnimationTimeout);
            playAnimationTimeout = null;
            slideshowIsPlaying = false;
            const animationsOn = !document.body.classList.contains('no-animation');
            const container = playGuideContainer;
            const media = container.querySelector('img, video');
            if (media && animationsOn) {
                media.style.animation = 'zoomOutImage 0.4s ease-in forwards';
            }
            const timeout = animationsOn ? 400 : 0;
            setTimeout(() => {
                document.body.classList.remove("play-mode-active");
                backdrop.classList.remove("visible", "preview-active");
                if (media) media.style.animation = '';
                playGuideContainer.innerHTML = "";
                if (playCaption) playCaption.innerHTML = "";
            }, timeout);
            slideshowPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
            slideshowPlayBtn.classList.remove('active-play');
            if (playButton) {
                const btnText = playButton.querySelector('.btn-text');
                if (btnText) btnText.textContent = ' Play';
            }
            updateBackgroundVideoVisibility();
        }

        function scheduleNext(isNav = false) {
            if (playAnimationTimeout) clearTimeout(playAnimationTimeout);
            if (!isNav && !slideshowIsPlaying) return;
            let guide;
            if (playGuidesQueue.length < 2) {
                guide = playGuidesQueue[0];
            } else {
                if (slideshowIsRandom) {
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * playGuidesQueue.length);
                    } while (playGuidesQueue.length > 1 && newIndex === playCurrentIndex);
                    playCurrentIndex = newIndex;
                } else if (!isNav) {
                    playCurrentIndex = (playCurrentIndex + 1) % playGuidesQueue.length;
                }
                guide = playGuidesQueue[playCurrentIndex];
            }
            if (!guide) return;
            lastPlayedGuide = guide;
            displayRandomGuide(guide);
        }

        function preloadNextGuide(count = 3) {
            if (!slideshowIsPlaying || playGuidesQueue.length < 2) return;
            for (let i = 1; i <= count; i++) {
                let nextIndex;
                if (slideshowIsRandom) {
                    nextIndex = Math.floor(Math.random() * playGuidesQueue.length);
                } else {
                    nextIndex = (playCurrentIndex + i) % playGuidesQueue.length;
                }
                if (nextIndex === playCurrentIndex) continue;
                const nextGuide = playGuidesQueue[nextIndex];
                if (!nextGuide || ['mp4', 'avi'].includes(nextGuide.format)) continue;
                const baseFilename = nextGuide.file.split("$$")[0].replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "");
                const hdPath = config.paths.previewHdFolderName ? `${config.paths.previewHdFolderName}/${encodeURIComponent(baseFilename)}.jpg` : null;
                if (hdPath) {
                    (new Image()).src = hdPath;
                }
            }
        }

        function displayRandomGuide(guide) {
            playCaption.classList.remove('visible');
            const container = playGuideContainer;
            const existingContent = container.firstChild;
            const showNewGuide = () => {
                container.innerHTML = "";
                playCaption.classList.remove('visible');
                const fallbackCover = document.documentElement.classList.contains("dark-mode") ? ".base-system/gfx/no_cover_dark.png" : ".base-system/gfx/no_cover_light.png";
                const baseFilename = guide.file.split("$$")[0].replace(/\.(pdf|epub|mobi|link|jpg|png|mp4|avi)$/i, "");
                const hdPath = config.paths.previewHdFolderName ? `${config.paths.previewHdFolderName}/${encodeURIComponent(baseFilename)}.jpg` : null;
                const sdPath = `${config.paths.coversFolderName}/${encodeURIComponent(baseFilename)}.jpg`;
                const directMediaPath = `${config.paths.dataFolderName}/${encodeURIComponent(guide.file)}`;
                const isVideo = ['mp4', 'avi'].includes(guide.format);
                const displayElement = document.createElement(isVideo ? 'video' : 'img');
                if (isVideo) {
                    displayElement.src = directMediaPath;
                    displayElement.controls = true;
                    displayElement.autoplay = true;
                    displayElement.onerror = () => {
                        displayElement.poster = sdPath;
                        displayElement.onerror = () => {
                            displayElement.poster = fallbackCover;
                            displayElement.onerror = null;
                        };
                    };
                } else {
                    displayElement.src = hdPath || sdPath;
                    displayElement.onerror = () => {
                        displayElement.src = sdPath;
                        displayElement.onerror = () => {
                            displayElement.src = fallbackCover;
                            displayElement.onerror = null;
                        };
                    };
                }
                const link = document.createElement('a');
                if (guide.format === 'link') {
                    const targetUrl = decodeUrlFromFilename(guide.file);
                    link.href = targetUrl;
                    if (!targetUrl.startsWith('.') && !targetUrl.startsWith('/')) {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    }
                } else {
                    const fileUrl = `${config.paths.dataFolderName}/${encodeURIComponent(guide.file)}`;
                    link.href = fileUrl;
                    if (guide.format === 'pdf' || isVideo) {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    } else {
                        link.download = guide.file;
                    }
                }
                link.appendChild(displayElement);
                container.appendChild(link);
                const currentIndexInQueue = playGuidesQueue.indexOf(guide);
                const counterText = playGuidesQueue.length > 1 ? `<b>${currentIndexInQueue + 1}</b><span class="caption-total"> / ${playGuidesQueue.length}</span>` : '';
                const descriptionText = guide.linkData.description || "";
                let titleText = guide.title.replace(/^\d{2}\s*/, "");
                playCaption.innerHTML = `<div class="caption-title-highlight">${counterText} ${titleText}</div><div class="caption-description">${descriptionText}</div>`;
                const animationsOn = !document.body.classList.contains('no-animation');
                if (areLabelsVisible) {
                    if (animationsOn) {
                        setTimeout(() => playCaption.classList.add('visible'), 1000);
                    } else {
                        playCaption.classList.add('visible');
                    }
                }
                if (slideshowIsPlaying && !isVideo) {
                    preloadNextGuide();
                    const slideDuration = 4000;
                    playAnimationTimeout = setTimeout(() => {
                        if (areLabelsVisible && animationsOn) {
                            playCaption.classList.remove('visible');
                            setTimeout(scheduleNext, 500);
                        } else {
                            scheduleNext();
                        }
                    }, animationsOn ? slideDuration - 500 : slideDuration);
                }
            };
            if (existingContent) {
                if (playAnimationTimeout) clearTimeout(playAnimationTimeout);
                const mediaElement = existingContent.querySelector ? existingContent.querySelector('img, video') : existingContent;
                if (mediaElement && !document.body.classList.contains('no-animation')) {
                    mediaElement.style.animation = 'zoomOutImage 0.4s ease-in forwards';
                }
                setTimeout(showNewGuide, document.body.classList.contains('no-animation') ? 0 : 400);
            } else {
                showNewGuide();
            }
        }



        function showMediaPreview(guideFilename) {
            stopPlayAnimation();
            backdrop.classList.add("visible", "preview-active");
            const guideFormat = getFileExtension(guideFilename);
            const isVideo = ['mp4', 'avi'].includes(guideFormat);
            const baseFilename = guideFilename.split("$$")[0].replace(/\.(jpg|png|mp4|avi)$/i, "");
            const hdPath = config.paths.previewHdFolderName ? `${config.paths.previewHdFolderName}/${encodeURIComponent(baseFilename)}.jpg` : null;
            const directPath = `${config.paths.dataFolderName}/${encodeURIComponent(guideFilename)}`;
            const fallbackCover = document.documentElement.classList.contains("dark-mode") ? ".base-system/gfx/no_cover_dark.png" : ".base-system/gfx/no_cover_light.png";
            const mediaElement = document.createElement(isVideo ? 'video' : 'img');
            mediaElement.className = "preview-media";
            if (isVideo) {
                mediaElement.src = directPath;
                mediaElement.controls = true;
                mediaElement.autoplay = true;
            } else {
                mediaElement.alt = "Podgląd obrazu";
                if (hdPath) {
                    mediaElement.src = hdPath;
                    mediaElement.onerror = () => {
                        mediaElement.src = directPath;
                        mediaElement.onerror = () => {
                            mediaElement.src = fallbackCover;
                            mediaElement.onerror = null;
                        };
                    };
                } else {
                    mediaElement.src = directPath;
                    mediaElement.onerror = () => {
                        mediaElement.src = fallbackCover;
                        mediaElement.onerror = null;
                    };
                }
            }
            const link = document.createElement('a');
            link.href = directPath;
            link.target = '_blank';
            link.appendChild(mediaElement);
            playGuideContainer.innerHTML = "";
            playGuideContainer.appendChild(link);
            playCaption.innerHTML = "";
            document.getElementById('lightbox-controls').style.display = 'none';
            document.getElementById('lightbox-minimizeBtn').style.display = 'none';
            document.getElementById('fullscreenBtnLightbox').style.display = 'none';
            const close = () => {
                backdrop.classList.remove("visible", "preview-active");
                playGuideContainer.innerHTML = "";
                document.getElementById('lightbox-controls').style.display = 'flex';
                document.getElementById('lightbox-minimizeBtn').style.display = 'flex';
                document.getElementById('fullscreenBtnLightbox').style.display = 'flex';
            };
            const backdropClose = (e) => {
                if (e.target === backdrop) close();
            };
            playCloseBtn.addEventListener("click", close, {
                once: true
            });
            setTimeout(() => {
                backdrop.addEventListener("click", backdropClose, {
                    once: true
                });
            }, 0);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Błąd przy próbie włączenia trybu pełnoekranowego: ${err.message} (${err.name})`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function updateFullscreenIcon() {
            const icon = fullscreenBtn.querySelector('i');
            const iconLightbox = fullscreenBtnLightbox.querySelector('i');
            if (document.fullscreenElement) {
                icon.className = 'fas fa-compress';
                iconLightbox.className = 'fas fa-compress';
                fullscreenBtn.title = "Wyjdź z pełnego ekranu";
                fullscreenBtnLightbox.title = "Wyjdź z pełnego ekranu";
            } else {
                icon.className = 'fas fa-expand';
                iconLightbox.className = 'fas fa-expand';
                fullscreenBtn.title = "Pełny ekran";
                fullscreenBtnLightbox.title = "Pełny ekran";
            }
        }

        function setupLightboxListeners() {
            fullscreenBtn.addEventListener('click', toggleFullScreen);
            fullscreenBtnLightbox.addEventListener('click', toggleFullScreen);
            document.addEventListener('fullscreenchange', updateFullscreenIcon);
            document.getElementById('lightbox-fxBtn').addEventListener('click', toggleFx);
            document.getElementById('lightbox-darkModeBtn').addEventListener('click', toggleDarkMode);
            lightboxLabelsBtn.addEventListener('click', () => {
                areLabelsVisible = !areLabelsVisible;
                saveToLocalStorage('labels_visible', areLabelsVisible);
                lightboxLabelsBtn.classList.toggle('active-play', areLabelsVisible);
                playCaption.classList.toggle('visible', areLabelsVisible);
            });
            document.getElementById('lightbox-videoBtn').addEventListener('click', (e) => {
                const target = e.target.closest('.multi-button-main, .multi-button-child');
                if (!target) return;
                switch (target.id) {
                    case 'lightbox-videoBtn-main':
                        target.parentElement.classList.toggle('expanded');
                        break;
                    case 'lightbox-video-toggle':
                        handleVideoStateChange();
                        break;
                    case 'lightbox-video-autoshuffle':
                        toggleAutoShuffle();
                        break;
                    case 'lightbox-video-prev':
                        changeBackgroundVideo(-1);
                        break;
                    case 'lightbox-video-next':
                        changeBackgroundVideo(1);
                        break;
                    case 'lightbox-video-reset':
                        resetVideoSettings();
                        break;
                }
            });
            document.getElementById('slideshow-play').addEventListener('click', toggleSlideshowPlayPause);
            document.getElementById('slideshow-shuffle').addEventListener('click', toggleSlideshowShuffle);
            document.getElementById('slideshow-stop').addEventListener('click', stopPlayAnimation);
            document.getElementById('slideshow-next').addEventListener('click', () => {
                if (!slideshowIsRandom) playCurrentIndex = (playCurrentIndex + 1) % playGuidesQueue.length;
                scheduleNext(true);
            });
            document.getElementById('slideshow-prev').addEventListener('click', () => {
                if (!slideshowIsRandom) playCurrentIndex = (playCurrentIndex - 1 + playGuidesQueue.length) % playGuidesQueue.length;
                scheduleNext(true);
            });
            document.getElementById('slideshow-first').addEventListener('click', () => {
                playCurrentIndex = 0;
                scheduleNext(true);
            });
            document.getElementById('slideshow-last').addEventListener('click', () => {
                playCurrentIndex = playGuidesQueue.length - 1;
                scheduleNext(true);
            });
        }
        setupLightboxListeners();

        backdrop.addEventListener("click", (e) => {
            if (e.target === backdrop && !backdrop.classList.contains('preview-active')) stopPlayAnimation();
        });

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func.apply(this, args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        let lastWindowWidth = window.innerWidth;
        const debouncedRender = debounce(() => {
            if (window.innerWidth !== lastWindowWidth) {
                lastWindowWidth = window.innerWidth;
                renderGuides();
            }
        }, 250);
        window.addEventListener("resize", debouncedRender);

        window.addEventListener("pageshow", function (event) {
            if (event.persisted) {
                applyFilters();
                renderGuides();
            }
        });
        document.addEventListener("DOMContentLoaded", () => {
             // +++ ZMIANA: Dodano .display-panel do animacji +++
            [".top-header", ".controls", ".display-panel", ".pagination", ".footer"].forEach(
                (sel, i) => {
                    const el = document.querySelector(sel);
                    if (el) {
                        el.style.animationDelay = `${0.2 + i * 0.15}s`;
                        el.classList.add(i < 3 ? "animated-header" : "animated-pagination");
                    }
                }
            );
            bgVideo.addEventListener('play', updateVideoBtnUI);
            bgVideo.addEventListener('pause', updateVideoBtnUI);
            bgVideo.addEventListener('error', () => {
                console.error("Błąd ładowania wideo tła.");
                bgVideo.style.display = 'none';
                document.body.classList.remove('video-ready');
            });
        });

        searchInput.addEventListener("input", () => {
            const query = searchInput.value.toLowerCase().trim();
            if (query === 'reset' || query === 'clear') {
                const command = query;
                searchInput.value = '';
                intro();
                if (command === 'reset') {
                    setTimeout(hardReset, 1300);
                } else if (command === 'clear') {
                    clearScreen();
                }
                return;
            }
            renderGuides();
            stopPlayAnimation();
        });

        formatFilter.addEventListener("change", () => {
            const value = formatFilter.value;
            orientationFilterState = null;
            if (value.startsWith("search:")) {
                searchInput.value = value.substring(7);
            } else {
                saveToLocalStorage('format', value);
            }
            renderGuides();
            stopPlayAnimation();
        });

        sortSelector.addEventListener("change", (e) => {
            if (e.target.value) {
                applySort(e.target.value, guides);
                saveToLocalStorage('sort', e.target.value);
                renderGuides();
            }
            e.target.value = "";
        });

        itemsPerPageSelector.addEventListener("change", (e) => {
            if (!e.target.value) return;
            selectedRowCount = parseInt(e.target.value);
            saveToLocalStorage('rows', selectedRowCount);
            renderGuides();
            stopPlayAnimation();
        });

        randomSelector.addEventListener("change", drawRandomGuides);
        fileInput.addEventListener("change", function () {
            if (this.files[0]) {
                loadAndParseFile(this.files[0]);
                stopPlayAnimation();
            }
        });

        resetButton.addEventListener('click', resetView);
    </script>
</body>

</html>
